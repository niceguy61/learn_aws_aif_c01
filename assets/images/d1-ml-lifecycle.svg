<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="step1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="step2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#0891B2"/>
    </linearGradient>
    <linearGradient id="step3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="step4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="step5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
    <linearGradient id="step6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#BE185D"/>
    </linearGradient>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="960" height="520" rx="16" fill="url(#bg2)"/>
  
  <text x="480" y="45" fill="#F8FAFC" font-size="24" font-weight="bold" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">
    AWS 머신러닝 개발 수명 주기 (ML Development Lifecycle)
  </text>
  <text x="480" y="70" fill="#94A3B8" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">
    비즈니스 문제 정의부터 MLOps 지속적 재학습까지 전주기 프로세스
  </text>

  <!-- Row 1: Steps 1, 2, 3 -->
  <!-- Step 1 -->
  <g transform="translate(50, 100)" filter="url(#glow)">
    <rect width="260" height="155" rx="12" fill="#1E293B" stroke="#3B82F6" stroke-width="2"/>
    <rect width="260" height="36" rx="12" fill="url(#step1)"/>
    <text x="130" y="24" fill="#FFFFFF" font-size="14" font-weight="bold" text-anchor="middle" font-family="sans-serif">1. 비즈니스 문제 정의</text>
    <text x="15" y="62" fill="#CBD5E1" font-size="12" font-family="sans-serif">• 비즈니스 목표 및 성공 지표 설정</text>
    <text x="15" y="82" fill="#CBD5E1" font-size="12" font-family="sans-serif">• ML 적합성 &amp; 데이터 가용성 평가</text>
    <text x="15" y="102" fill="#CBD5E1" font-size="12" font-family="sans-serif">• 가장 단순한 사전 훈련 AI부터 검토</text>
    <rect x="15" y="118" width="230" height="24" rx="6" fill="#0F172A"/>
    <text x="130" y="134" fill="#60A5FA" font-size="11" font-weight="bold" text-anchor="middle" font-family="sans-serif">비용 편익 분석 &amp; KPI 정의</text>
  </g>

  <!-- Step 2 -->
  <g transform="translate(350, 100)" filter="url(#glow)">
    <rect width="260" height="155" rx="12" fill="#1E293B" stroke="#06B6D4" stroke-width="2"/>
    <rect width="260" height="36" rx="12" fill="url(#step2)"/>
    <text x="130" y="24" fill="#FFFFFF" font-size="14" font-weight="bold" text-anchor="middle" font-family="sans-serif">2. 데이터 수집 &amp; 준비</text>
    <text x="15" y="62" fill="#CBD5E1" font-size="12" font-family="sans-serif">• ETL 파이프라인 &amp; 결측치/이상치 정제</text>
    <text x="15" y="82" fill="#CBD5E1" font-size="12" font-family="sans-serif">• 데이터 라벨링 (활성 학습)</text>
    <text x="15" y="102" fill="#CBD5E1" font-size="12" font-family="sans-serif">• 표준 분할: 80% 훈련 / 10% 검증 / 10% 테스트</text>
    <rect x="15" y="118" width="230" height="24" rx="6" fill="#0F172A"/>
    <text x="130" y="134" fill="#22D3EE" font-size="11" font-weight="bold" text-anchor="middle" font-family="sans-serif">Glue · DataBrew · Ground Truth</text>
  </g>

  <!-- Step 3 -->
  <g transform="translate(650, 100)" filter="url(#glow)">
    <rect width="260" height="155" rx="12" fill="#1E293B" stroke="#10B981" stroke-width="2"/>
    <rect width="260" height="36" rx="12" fill="url(#step3)"/>
    <text x="130" y="24" fill="#FFFFFF" font-size="14" font-weight="bold" text-anchor="middle" font-family="sans-serif">3. 모델 개발 &amp; 훈련</text>
    <text x="15" y="62" fill="#CBD5E1" font-size="12" font-family="sans-serif">• 알고리즘 선택 (내장/커스텀 컨테이너)</text>
    <text x="15" y="82" fill="#CBD5E1" font-size="12" font-family="sans-serif">• 대규모 병렬 분산 훈련 클러스터</text>
    <text x="15" y="102" fill="#CBD5E1" font-size="12" font-family="sans-serif">• 하이퍼파라미터 자동 튜닝 (AMT)</text>
    <rect x="15" y="118" width="230" height="24" rx="6" fill="#0F172A"/>
    <text x="130" y="134" fill="#34D399" font-size="11" font-weight="bold" text-anchor="middle" font-family="sans-serif">SageMaker Training · Experiments</text>
  </g>

  <!-- Row 2: Steps 6, 5, 4 -->
  <!-- Step 6 -->
  <g transform="translate(50, 310)" filter="url(#glow)">
    <rect width="260" height="155" rx="12" fill="#1E293B" stroke="#EC4899" stroke-width="2"/>
    <rect width="260" height="36" rx="12" fill="url(#step6)"/>
    <text x="130" y="24" fill="#FFFFFF" font-size="14" font-weight="bold" text-anchor="middle" font-family="sans-serif">6. 모니터링 &amp; MLOps</text>
    <text x="15" y="62" fill="#CBD5E1" font-size="12" font-family="sans-serif">• 데이터 드리프트 &amp; 개념 드리프트 감지</text>
    <text x="15" y="82" fill="#CBD5E1" font-size="12" font-family="sans-serif">• CloudWatch 연동 알림 및 경보</text>
    <text x="15" y="102" fill="#CBD5E1" font-size="12" font-family="sans-serif">• 재훈련 파이프라인 자동 트리거</text>
    <rect x="15" y="118" width="230" height="24" rx="6" fill="#0F172A"/>
    <text x="130" y="134" fill="#F472B6" font-size="11" font-weight="bold" text-anchor="middle" font-family="sans-serif">Model Monitor · SageMaker Pipelines</text>
  </g>

  <!-- Step 5 -->
  <g transform="translate(350, 310)" filter="url(#glow)">
    <rect width="260" height="155" rx="12" fill="#1E293B" stroke="#8B5CF6" stroke-width="2"/>
    <rect width="260" height="36" rx="12" fill="url(#step5)"/>
    <text x="130" y="24" fill="#FFFFFF" font-size="14" font-weight="bold" text-anchor="middle" font-family="sans-serif">5. 모델 배포 &amp; 추론</text>
    <text x="15" y="62" fill="#CBD5E1" font-size="12" font-family="sans-serif">• 실시간 (Real-time): 24/7 저지연 서빙</text>
    <text x="15" y="82" fill="#CBD5E1" font-size="12" font-family="sans-serif">• 서버리스 (Serverless): 비용 0 축소</text>
    <text x="15" y="102" fill="#CBD5E1" font-size="12" font-family="sans-serif">• 비동기 (Async) / 배치 변환 (Batch)</text>
    <rect x="15" y="118" width="230" height="24" rx="6" fill="#0F172A"/>
    <text x="130" y="134" fill="#A78BFA" font-size="11" font-weight="bold" text-anchor="middle" font-family="sans-serif">SageMaker Hosting Endpoints</text>
  </g>

  <!-- Step 4 -->
  <g transform="translate(650, 310)" filter="url(#glow)">
    <rect width="260" height="155" rx="12" fill="#1E293B" stroke="#F59E0B" stroke-width="2"/>
    <rect width="260" height="36" rx="12" fill="url(#step4)"/>
    <text x="130" y="24" fill="#FFFFFF" font-size="14" font-weight="bold" text-anchor="middle" font-family="sans-serif">4. 모델 평가 &amp; 검증</text>
    <text x="15" y="62" fill="#CBD5E1" font-size="12" font-family="sans-serif">• 오프라인 평가: 정확도, F1, AUC, RMSE</text>
    <text x="15" y="82" fill="#CBD5E1" font-size="12" font-family="sans-serif">• 편향 및 공정성 분석 (공정성 제약)</text>
    <text x="15" y="102" fill="#CBD5E1" font-size="12" font-family="sans-serif">• 설명 가능성 검증 (Explainability)</text>
    <rect x="15" y="118" width="230" height="24" rx="6" fill="#0F172A"/>
    <text x="130" y="134" fill="#FBBF24" font-size="11" font-weight="bold" text-anchor="middle" font-family="sans-serif">SageMaker Clarify · Model Cards</text>
  </g>

  <!-- Arrows -->
  <path d="M 315 177 L 345 177" stroke="#94A3B8" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M 615 177 L 645 177" stroke="#94A3B8" stroke-width="3" fill="none"/>
  <path d="M 780 260 L 780 305" stroke="#94A3B8" stroke-width="3" fill="none"/>
  <path d="M 645 387 L 615 387" stroke="#94A3B8" stroke-width="3" fill="none"/>
  <path d="M 345 387 L 315 387" stroke="#94A3B8" stroke-width="3" fill="none"/>
  <path d="M 180 305 L 180 260" stroke="#EC4899" stroke-width="2" stroke-dasharray="6,4" fill="none"/>
  <text x="120" y="285" fill="#F472B6" font-size="11" font-weight="bold" font-family="sans-serif">자동 재학습 루프</text>
</svg>
