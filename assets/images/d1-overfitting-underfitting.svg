<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%" role="img" aria-labelledby="d1-overfitting-underfitting-title d1-overfitting-underfitting-desc">
  <title id="d1-overfitting-underfitting-title">과소적합, 적절한 적합, 과대적합 비교</title>
  <desc id="d1-overfitting-underfitting-desc">모델 복잡도에 따라 훈련 오차와 검증 오차가 달라지는 개념을 통해 과소적합과 과대적합의 차이를 설명하는 교육용 그래프입니다.</desc>
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
  </defs>

  <rect width="900" height="480" rx="16" fill="url(#bg4)"/>
  
  <text x="450" y="42" fill="#F8FAFC" font-size="24" font-weight="bold" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">
    과소적합 (Underfitting) vs 최적 균형 vs 과대적합 (Overfitting)
  </text>
  <text x="450" y="66" fill="#94A3B8" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">
    모델 복잡도 및 훈련 시간에 따른 훈련 오차(Training Error)와 검증 오차(Validation Error)의 변화
  </text>

  <!-- Coordinate System -->
  <g transform="translate(100, 100)">
    <!-- Axes -->
    <line x1="60" y1="280" x2="720" y2="280" stroke="#64748B" stroke-width="2"/>
    <line x1="60" y1="40" x2="60" y2="280" stroke="#64748B" stroke-width="2"/>

    <!-- Axis Labels -->
    <text x="390" y="315" fill="#CBD5E1" font-size="14" font-weight="bold" font-family="sans-serif" text-anchor="middle">모델 복잡도 / 훈련 시간 (Model Complexity / Training Epochs) ➔</text>
    <text x="30" y="25" fill="#CBD5E1" font-size="14" font-weight="bold" font-family="sans-serif" transform="rotate(-90 30 25)" text-anchor="middle">오차율 (Error) ➔</text>

    <!-- Zone Backgrounds -->
    <!-- Underfitting Zone -->
    <rect x="60" y="40" width="200" height="240" fill="#F59E0B" fill-opacity="0.08"/>
    <text x="160" y="70" fill="#FBBF24" font-size="15" font-weight="bold" font-family="sans-serif" text-anchor="middle">과소적합 영역 (Underfitting)</text>
    <text x="160" y="92" fill="#FDE68A" font-size="11" font-family="sans-serif" text-anchor="middle">훈련 부족 / 모델 너무 단순</text>
    <text x="160" y="110" fill="#FDE68A" font-size="11" font-family="sans-serif" text-anchor="middle">훈련 오차 &amp; 검증 오차 모두 높음 ⬆️</text>

    <!-- Optimal Zone -->
    <rect x="260" y="40" width="180" height="240" fill="#10B981" fill-opacity="0.12"/>
    <line x1="350" y1="40" x2="350" y2="280" stroke="#10B981" stroke-width="2" stroke-dasharray="6,4"/>
    <text x="350" y="70" fill="#34D399" font-size="15" font-weight="bold" font-family="sans-serif" text-anchor="middle">✅ 최적 균형 (Optimal Fit)</text>
    <text x="350" y="92" fill="#A7F3D0" font-size="11" font-family="sans-serif" text-anchor="middle">최고의 일반화(Generalization)</text>
    <text x="350" y="110" fill="#A7F3D0" font-size="11" font-family="sans-serif" text-anchor="middle">새로운 데이터에서 최소 오차 달성 ⬇️</text>

    <!-- Overfitting Zone -->
    <rect x="440" y="40" width="280" height="240" fill="#EC4899" fill-opacity="0.08"/>
    <text x="580" y="70" fill="#F472B6" font-size="15" font-weight="bold" font-family="sans-serif" text-anchor="middle">과대적합 영역 (Overfitting)</text>
    <text x="580" y="92" fill="#FBCFE8" font-size="11" font-family="sans-serif" text-anchor="middle">과도한 훈련 / 노이즈(Noise) 암기</text>
    <text x="580" y="110" fill="#FBCFE8" font-size="11" font-family="sans-serif" text-anchor="middle">훈련 오차는 0에 수렴하나 실서비스 오답 속출 ⬆️</text>

    <!-- Training Error Curve (Blue, continually decreasing) -->
    <path d="M 70 230 C 150 180, 250 130, 350 95 C 450 70, 550 50, 710 42" stroke="#3B82F6" stroke-width="3.5" fill="none"/>
    <text x="680" y="32" fill="#60A5FA" font-size="12" font-weight="bold" font-family="sans-serif">훈련 오차 (Training Error)</text>

    <!-- Validation Error Curve (Red, U-shape: decreases then shoots up) -->
    <path d="M 70 260 C 150 200, 260 140, 350 120 C 440 140, 550 210, 710 270" stroke="#F43F5E" stroke-width="3.5" fill="none"/>
    <text x="680" y="285" fill="#FB7185" font-size="12" font-weight="bold" font-family="sans-serif">검증 오차 (Validation Error)</text>

    <!-- Solution Badges at bottom -->
    <g transform="translate(60, 290)">
      <text x="100" y="45" fill="#FBBF24" font-size="11" font-weight="bold" font-family="sans-serif" text-anchor="middle">💡 해결책: 더 오래 학습, 파라미터 증대</text>
      <text x="520" y="45" fill="#F472B6" font-size="11" font-weight="bold" font-family="sans-serif" text-anchor="middle">💡 해결책: '더 다양한 데이터' 수집, 조기 종료(Early Stopping)</text>
    </g>
  </g>
</svg>
