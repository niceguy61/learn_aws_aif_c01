<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bg6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
  </defs>

  <rect width="960" height="520" rx="16" fill="url(#bg6)"/>
  
  <text x="480" y="42" fill="#F8FAFC" font-size="24" font-weight="bold" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">
    AWS 실제 엔터프라이즈 AI 혁신 사례 (6대 고객사)
  </text>
  <text x="480" y="66" fill="#94A3B8" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">
    공식 시험(AIF-C01) 출제 빈도가 높은 실무 비즈니스 시나리오 및 AWS 서비스 매핑
  </text>

  <!-- 6 Case Study Cards (2 rows of 3) -->
  <!-- Card 1: MasterCard -->
  <g transform="translate(50, 95)">
    <rect width="260" height="185" rx="12" fill="#1E293B" stroke="#3B82F6" stroke-width="1.5"/>
    <rect width="260" height="34" rx="12" fill="#1E3A8A"/>
    <text x="130" y="23" fill="#60A5FA" font-size="13" font-weight="bold" text-anchor="middle" font-family="sans-serif">💳 MasterCard (사기 탐지)</text>
    <text x="15" y="60" fill="#F8FAFC" font-size="12" font-weight="bold" font-family="sans-serif">도구: SageMaker + GenAI</text>
    <text x="15" y="80" fill="#CBD5E1" font-size="11" font-family="sans-serif">• 신용카드 거래 실시간 사기 점수 산출</text>
    <text x="15" y="100" fill="#CBD5E1" font-size="11" font-family="sans-serif">• 사기 거래 탐지율 <b>3배 증가</b></text>
    <text x="15" y="120" fill="#CBD5E1" font-size="11" font-family="sans-serif">• 거짓 긍정(오탐) <b>10배 감소</b></text>
    <text x="15" y="140" fill="#CBD5E1" font-size="11" font-family="sans-serif">• LLM 프롬프트에 거래 내역 제공 (20% 개선)</text>
    <rect x="15" y="152" width="230" height="22" rx="6" fill="#0F172A"/>
    <text x="130" y="167" fill="#60A5FA" font-size="10" font-weight="bold" text-anchor="middle" font-family="sans-serif">핵심 키워드: 사기 탐지 3배↑, 오탐 10배↓</text>
  </g>

  <!-- Card 2: DoorDash -->
  <g transform="translate(350, 95)">
    <rect width="260" height="185" rx="12" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5"/>
    <rect width="260" height="34" rx="12" fill="#78350F"/>
    <text x="130" y="23" fill="#FBBF24" font-size="13" font-weight="bold" text-anchor="middle" font-family="sans-serif">🍔 DoorDash (IVR 교체)</text>
    <text x="15" y="60" fill="#F8FAFC" font-size="12" font-weight="bold" font-family="sans-serif">도구: Amazon Lex (자연어 처리)</text>
    <text x="15" y="80" fill="#CBD5E1" font-size="11" font-family="sans-serif">• 구형 터치톤(버튼 누르기) ARS 교체</text>
    <text x="15" y="100" fill="#CBD5E1" font-size="11" font-family="sans-serif">• 고객이 말하기만 하면 자연어 의도 파악</text>
    <text x="15" y="120" fill="#CBD5E1" font-size="11" font-family="sans-serif">• 상담원 연결 대기 시간 대폭 단축</text>
    <text x="15" y="140" fill="#CBD5E1" font-size="11" font-family="sans-serif">• 고객 셀프 서비스 채택률 급증</text>
    <rect x="15" y="152" width="230" height="22" rx="6" fill="#0F172A"/>
    <text x="130" y="167" fill="#FBBF24" font-size="10" font-weight="bold" text-anchor="middle" font-family="sans-serif">핵심 키워드: Amazon Lex 음성 대화형 IVR</text>
  </g>

  <!-- Card 3: Laredo Petroleum -->
  <g transform="translate(650, 95)">
    <rect width="260" height="185" rx="12" fill="#1E293B" stroke="#10B981" stroke-width="1.5"/>
    <rect width="260" height="34" rx="12" fill="#064E3B"/>
    <text x="130" y="23" fill="#34D399" font-size="13" font-weight="bold" text-anchor="middle" font-family="sans-serif">🛢️ Laredo (예지 보전)</text>
    <text x="15" y="60" fill="#F8FAFC" font-size="12" font-weight="bold" font-family="sans-serif">도구: SageMaker + IoT 센서</text>
    <text x="15" y="80" fill="#CBD5E1" font-size="11" font-family="sans-serif">• 1,300개 이상 유정 압력/온도/유량 센서</text>
    <text x="15" y="100" fill="#CBD5E1" font-size="11" font-family="sans-serif">• 스트리밍 데이터를 실시간 ML 모니터링</text>
    <text x="15" y="120" fill="#CBD5E1" font-size="11" font-family="sans-serif">• 파이프라인 누출 사전 감지 및 예방</text>
    <text x="15" y="140" fill="#CBD5E1" font-size="11" font-family="sans-serif">• 천연가스 연소 감소로 환경 보호 기여</text>
    <rect x="15" y="152" width="230" height="22" rx="6" fill="#0F172A"/>
    <text x="130" y="167" fill="#34D399" font-size="10" font-weight="bold" text-anchor="middle" font-family="sans-serif">핵심 키워드: 유정 센서 실시간 모니터링</text>
  </g>

  <!-- Card 4: Booking.com -->
  <g transform="translate(50, 305)">
    <rect width="260" height="185" rx="12" fill="#1E293B" stroke="#EC4899" stroke-width="1.5"/>
    <rect width="260" height="34" rx="12" fill="#831843"/>
    <text x="130" y="23" fill="#F472B6" font-size="13" font-weight="bold" text-anchor="middle" font-family="sans-serif">🏨 Booking.com (추천 + RAG)</text>
    <text x="15" y="60" fill="#F8FAFC" font-size="12" font-weight="bold" font-family="sans-serif">도구: SageMaker + RAG 플래너</text>
    <text x="15" y="80" fill="#CBD5E1" font-size="11" font-family="sans-serif">• 2,800만+ 숙박 목록, 150TB+ 데이터</text>
    <text x="15" y="100" fill="#CBD5E1" font-size="11" font-family="sans-serif">• <b>AI Trip Planner</b> 대화형 생성형 AI</text>
    <text x="15" y="120" fill="#CBD5E1" font-size="11" font-family="sans-serif">• 예약 API + 고객 리뷰 RAG 검색 결합</text>
    <text x="15" y="140" fill="#CBD5E1" font-size="11" font-family="sans-serif">• 환각 방지 및 최신 정보 기반 답변 생성</text>
    <rect x="15" y="152" width="230" height="22" rx="6" fill="#0F172A"/>
    <text x="130" y="167" fill="#F472B6" font-size="10" font-weight="bold" text-anchor="middle" font-family="sans-serif">핵심 키워드: RAG (검색 증강 생성)</text>
  </g>

  <!-- Card 5: Pinterest -->
  <g transform="translate(350, 305)">
    <rect width="260" height="185" rx="12" fill="#1E293B" stroke="#8B5CF6" stroke-width="1.5"/>
    <rect width="260" height="34" rx="12" fill="#4C1D95"/>
    <text x="130" y="23" fill="#A78BFA" font-size="13" font-weight="bold" text-anchor="middle" font-family="sans-serif">📌 Pinterest (시각적 검색)</text>
    <text x="15" y="60" fill="#F8FAFC" font-size="12" font-weight="bold" font-family="sans-serif">도구: S3 + Ground Truth + MTurk</text>
    <text x="15" y="80" fill="#CBD5E1" font-size="11" font-family="sans-serif">• 4.5억 사용자, 수십억 장 이미지 호스팅</text>
    <text x="15" y="100" fill="#CBD5E1" font-size="11" font-family="sans-serif">• <b>Pinterest Lens</b>: 사진 촬영 유사 상품 검색</text>
    <text x="15" y="120" fill="#CBD5E1" font-size="11" font-family="sans-serif">• 대용량 훈련 이미지 S3 저장 및 재학습</text>
    <text x="15" y="140" fill="#CBD5E1" font-size="11" font-family="sans-serif">• Mechanical Turk 크라우드소싱 라벨링</text>
    <rect x="15" y="152" width="230" height="22" rx="6" fill="#0F172A"/>
    <text x="130" y="167" fill="#A78BFA" font-size="10" font-weight="bold" text-anchor="middle" font-family="sans-serif">핵심 키워드: Ground Truth + MTurk 라벨링</text>
  </g>

  <!-- Card 6: AffordableTours -->
  <g transform="translate(650, 305)">
    <rect width="260" height="185" rx="12" fill="#1E293B" stroke="#06B6D4" stroke-width="1.5"/>
    <rect width="260" height="34" rx="12" fill="#164E63"/>
    <text x="130" y="23" fill="#22D3EE" font-size="13" font-weight="bold" text-anchor="middle" font-family="sans-serif">✈️ AffordableTours (수요 예측)</text>
    <text x="15" y="60" fill="#F8FAFC" font-size="12" font-weight="bold" font-family="sans-serif">도구: Amazon Forecast (시계열)</text>
    <text x="15" y="80" fill="#CBD5E1" font-size="11" font-family="sans-serif">• 여행사 고객 상담 통화량 예측</text>
    <text x="15" y="100" fill="#CBD5E1" font-size="11" font-family="sans-serif">• 상담원 과다/과소 배치 문제 해결</text>
    <text x="15" y="120" fill="#CBD5E1" font-size="11" font-family="sans-serif">• 부재중 통화(Missed Call) <b>20% 감소</b></text>
    <text x="15" y="140" fill="#CBD5E1" font-size="11" font-family="sans-serif">• 내장 딥러닝/통계 예측 알고리즘 활용</text>
    <rect x="15" y="152" width="230" height="22" rx="6" fill="#0F172A"/>
    <text x="130" y="167" fill="#22D3EE" font-size="10" font-weight="bold" text-anchor="middle" font-family="sans-serif">핵심 키워드: Amazon Forecast 시계열 예측</text>
  </g>
</svg>
