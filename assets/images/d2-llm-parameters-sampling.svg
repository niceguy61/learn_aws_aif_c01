<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 520" width="100%" height="100%" role="img" aria-labelledby="d2-llm-parameters-sampling-title d2-llm-parameters-sampling-desc">
  <title id="d2-llm-parameters-sampling-title">생성 모델의 추론 파라미터와 후보 토큰 선택</title>
  <desc id="d2-llm-parameters-sampling-desc">온도는 다음 토큰 후보 분포의 집중도를 조절하고, Top-P와 Top-K는 후보 집합을 제한하는 방식을 개념적으로 비교합니다. 실제 값과 지원되는 조합은 모델별로 다릅니다.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#0F172A"/><stop offset="100%" stop-color="#1E293B"/></linearGradient>
  </defs>
  <rect width="940" height="520" rx="16" fill="url(#bg)"/>
  <g font-family="Segoe UI, sans-serif">
    <text x="470" y="42" text-anchor="middle" fill="#F8FAFC" font-size="24" font-weight="700">추론 파라미터: 후보 토큰을 고르는 세 가지 관점</text>
    <text x="470" y="66" text-anchor="middle" fill="#CBD5E1" font-size="13">값의 범위·기본값·상호 작용은 선택한 모델과 API 설명서를 확인합니다.</text>

    <rect x="45" y="110" width="260" height="280" rx="14" fill="#172554" stroke="#60A5FA" stroke-width="2"/>
    <text x="175" y="145" text-anchor="middle" fill="#DBEAFE" font-size="18" font-weight="700">온도</text>
    <text x="175" y="175" text-anchor="middle" fill="#BFDBFE" font-size="13">후보 확률 분포의 집중도</text>
    <rect x="80" y="210" width="160" height="26" rx="5" fill="#2563EB"/><rect x="80" y="248" width="72" height="26" rx="5" fill="#3B82F6"/><rect x="80" y="286" width="38" height="26" rx="5" fill="#60A5FA"/>
    <text x="175" y="340" text-anchor="middle" fill="#DBEAFE" font-size="12">낮은 값: 상위 후보에 더 집중</text>
    <text x="175" y="365" text-anchor="middle" fill="#DBEAFE" font-size="12">높은 값: 후보 분포가 더 넓어질 수 있음</text>

    <rect x="340" y="110" width="260" height="280" rx="14" fill="#064E3B" stroke="#34D399" stroke-width="2"/>
    <text x="470" y="145" text-anchor="middle" fill="#D1FAE5" font-size="18" font-weight="700">Top-P</text>
    <text x="470" y="175" text-anchor="middle" fill="#A7F3D0" font-size="13">누적 확률 기준 후보 집합</text>
    <rect x="375" y="215" width="165" height="34" rx="5" fill="#10B981"/><rect x="540" y="215" width="25" height="34" rx="5" fill="#64748B"/>
    <text x="470" y="280" text-anchor="middle" fill="#D1FAE5" font-size="12">확률이 높은 후보부터 누적</text>
    <text x="470" y="305" text-anchor="middle" fill="#D1FAE5" font-size="12">임계값까지의 후보를 사용</text>
    <text x="470" y="350" text-anchor="middle" fill="#A7F3D0" font-size="12">후보 수는 분포에 따라 달라질 수 있음</text>

    <rect x="635" y="110" width="260" height="280" rx="14" fill="#78350F" stroke="#FBBF24" stroke-width="2"/>
    <text x="765" y="145" text-anchor="middle" fill="#FEF3C7" font-size="18" font-weight="700">Top-K</text>
    <text x="765" y="175" text-anchor="middle" fill="#FDE68A" font-size="13">상위 개수 기준 후보 집합</text>
    <rect x="675" y="215" width="46" height="46" rx="6" fill="#D97706"/><rect x="731" y="215" width="46" height="46" rx="6" fill="#D97706"/><rect x="787" y="215" width="46" height="46" rx="6" fill="#D97706"/>
    <text x="698" y="245" text-anchor="middle" fill="white" font-size="12">1</text><text x="754" y="245" text-anchor="middle" fill="white" font-size="12">2</text><text x="810" y="245" text-anchor="middle" fill="white" font-size="12">K</text>
    <text x="765" y="305" text-anchor="middle" fill="#FEF3C7" font-size="12">상위 K개 후보만 남김</text>
    <text x="765" y="350" text-anchor="middle" fill="#FDE68A" font-size="12">후보 수는 고정, 확률은 문맥마다 달라짐</text>

    <rect x="75" y="425" width="790" height="52" rx="9" fill="#1E293B" stroke="#64748B"/>
    <text x="470" y="447" text-anchor="middle" fill="#F8FAFC" font-size="13" font-weight="700">판단 순서: 목적을 정하고 → 모델별 지원 범위를 확인하고 → 대표 프롬프트로 평가합니다.</text>
    <text x="470" y="468" text-anchor="middle" fill="#CBD5E1" font-size="12">낮은 무작위성이나 후보 제한만으로 사실성·안전성·품질이 보장되지는 않습니다.</text>
  </g>
</svg>