<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="title desc">
  <title id="title">텍스트가 토큰과 임베딩을 거쳐 다음 토큰 생성으로 이어지는 과정</title>
  <desc id="desc">입력 텍스트가 토크나이저를 거쳐 토큰 ID와 임베딩으로 바뀌고, 위치 정보와 셀프 어텐션을 거쳐 다음 토큰 후보를 생성하는 학습용 개념도이다.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0F172A"/><stop offset="1" stop-color="#1E293B"/></linearGradient></defs>
  <rect width="960" height="440" rx="18" fill="url(#bg)"/>
  <text x="480" y="42" fill="#F8FAFC" font-size="23" font-weight="700" text-anchor="middle" font-family="sans-serif">텍스트 → 토큰 → 임베딩 → 다음 토큰</text>
  <text x="480" y="66" fill="#94A3B8" font-size="13" text-anchor="middle" font-family="sans-serif">학습용 개념도 — 실제 모델 구현과 토큰화 방식은 모델마다 다릅니다.</text>
  <g font-family="sans-serif" text-anchor="middle">
    <g transform="translate(35 120)"><rect width="150" height="180" rx="14" fill="#172554" stroke="#3B82F6" stroke-width="2"/><text x="75" y="38" fill="#93C5FD" font-size="18" font-weight="700">1. 입력</text><text x="75" y="82" fill="#E2E8F0" font-size="15">“AI를 배워요”</text><text x="75" y="124" fill="#94A3B8" font-size="12">사람이 읽는</text><text x="75" y="144" fill="#94A3B8" font-size="12">텍스트</text></g>
    <path d="M185 210H225" stroke="#60A5FA" stroke-width="4"/><path d="M220 202l14 8-14 8" fill="#60A5FA"/>
    <g transform="translate(235 120)"><rect width="150" height="180" rx="14" fill="#064E3B" stroke="#10B981" stroke-width="2"/><text x="75" y="38" fill="#6EE7B7" font-size="18" font-weight="700">2. 토큰화</text><text x="75" y="82" fill="#E2E8F0" font-size="14">[AI] [를] [배워] [요]</text><text x="75" y="124" fill="#94A3B8" font-size="12">토큰 ID로</text><text x="75" y="144" fill="#94A3B8" font-size="12">분할·변환</text></g>
    <path d="M385 210H425" stroke="#34D399" stroke-width="4"/><path d="M420 202l14 8-14 8" fill="#34D399"/>
    <g transform="translate(435 120)"><rect width="150" height="180" rx="14" fill="#78350F" stroke="#F59E0B" stroke-width="2"/><text x="75" y="38" fill="#FCD34D" font-size="18" font-weight="700">3. 임베딩</text><text x="75" y="82" fill="#E2E8F0" font-size="14">[0.12, −0.48, …]</text><text x="75" y="124" fill="#94A3B8" font-size="12">의미를 담은</text><text x="75" y="144" fill="#94A3B8" font-size="12">숫자 벡터</text></g>
    <path d="M585 210H625" stroke="#FBBF24" stroke-width="4"/><path d="M620 202l14 8-14 8" fill="#FBBF24"/>
    <g transform="translate(635 120)"><rect width="150" height="180" rx="14" fill="#581C87" stroke="#A855F7" stroke-width="2"/><text x="75" y="38" fill="#D8B4FE" font-size="18" font-weight="700">4. 문맥화</text><text x="75" y="82" fill="#E2E8F0" font-size="14">위치 + 어텐션</text><text x="75" y="124" fill="#94A3B8" font-size="12">토큰 사이</text><text x="75" y="144" fill="#94A3B8" font-size="12">관계 계산</text></g>
    <path d="M785 210H825" stroke="#C084FC" stroke-width="4"/><path d="M820 202l14 8-14 8" fill="#C084FC"/>
    <g transform="translate(835 120)"><rect width="90" height="180" rx="14" fill="#7F1D1D" stroke="#F87171" stroke-width="2"/><text x="45" y="38" fill="#FCA5A5" font-size="18" font-weight="700">5.</text><text x="45" y="82" fill="#E2E8F0" font-size="13">다음</text><text x="45" y="104" fill="#E2E8F0" font-size="13">토큰</text><text x="45" y="136" fill="#94A3B8" font-size="11">후보</text></g>
  </g>
  <text x="480" y="370" fill="#CBD5E1" font-size="14" text-anchor="middle" font-family="sans-serif">핵심: 토큰은 단위, 토크나이저는 나누는 도구, 임베딩은 의미를 표현하는 벡터입니다.</text>
</svg>