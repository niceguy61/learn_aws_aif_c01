<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="title desc">
  <title id="title">AI 거버넌스와 규정 준수 증적 주기</title>
  <desc id="desc">책임과 정책 정의, 위험 및 통제 설계, 증적 수집, 감사와 검토, 개선을 순환하는 AI 거버넌스 학습용 개념도이다.</desc>
  <rect width="960" height="460" rx="18" fill="#0F172A"/>
  <text x="480" y="42" fill="#F8FAFC" font-size="23" font-weight="700" text-anchor="middle" font-family="sans-serif">AI 거버넌스: 정책에서 증적과 개선까지</text>
  <text x="480" y="66" fill="#94A3B8" font-size="13" text-anchor="middle" font-family="sans-serif">특정 규제의 충족 여부는 조직·지역·업종별 요구와 최신 법률 자문에 따라 별도로 확인합니다.</text>
  <g font-family="sans-serif" text-anchor="middle"><g stroke-width="3"><circle cx="240" cy="170" r="75" fill="#172554" stroke="#60A5FA"/><circle cx="480" cy="130" r="75" fill="#064E3B" stroke="#34D399"/><circle cx="720" cy="170" r="75" fill="#78350F" stroke="#FCD34D"/><circle cx="650" cy="345" r="75" fill="#581C87" stroke="#C084FC"/><circle cx="310" cy="345" r="75" fill="#7F1D1D" stroke="#F87171"/></g><g fill="#F8FAFC" font-size="16" font-weight="700"><text x="240" y="165">책임·정책</text><text x="480" y="125">위험·통제</text><text x="720" y="165">증적 수집</text><text x="650" y="340">감사·검토</text><text x="310" y="340">개선·교육</text></g><g fill="#CBD5E1" font-size="11"><text x="240" y="188">소유자·범위·기준</text><text x="480" y="148">보호 조치·측정</text><text x="720" y="188">기록·계보·보고</text><text x="650" y="363">독립 검토·판단</text><text x="310" y="363">변경·재평가</text></g></g>
