<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 500" width="100%" height="100%" role="img" aria-labelledby="d2-genai-project-lifecycle-title d2-genai-project-lifecycle-desc">
  <title id="d2-genai-project-lifecycle-title">생성형 AI 프로젝트의 반복적 수명 주기</title>
  <desc id="d2-genai-project-lifecycle-desc">문제와 성공 기준을 정의하고, 데이터와 모델 접근법을 선택해 평가, 배포, 모니터링을 반복하는 생성형 AI 프로젝트의 개념적 흐름입니다.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#0F172A"/><stop offset="100%" stop-color="#1E293B"/></linearGradient>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#CBD5E1"/></marker>
  </defs>
  <rect width="980" height="500" rx="16" fill="url(#bg)"/>
  <g font-family="Segoe UI, sans-serif">
    <text x="490" y="42" text-anchor="middle" fill="#F8FAFC" font-size="24" font-weight="700">생성형 AI 프로젝트: 반복해서 검증하는 학습용 흐름</text>
    <text x="490" y="67" text-anchor="middle" fill="#CBD5E1" font-size="13">실제 순서와 사용 서비스는 조직의 요구 사항, 위험, 운영 환경에 따라 달라집니다.</text>
    <g fill="#0F172A" stroke-width="2">
      <rect x="45" y="150" width="130" height="115" rx="12" stroke="#60A5FA"/><rect x="205" y="150" width="130" height="115" rx="12" stroke="#A78BFA"/><rect x="365" y="150" width="130" height="115" rx="12" stroke="#34D399"/><rect x="525" y="150" width="130" height="115" rx="12" stroke="#FBBF24"/><rect x="685" y="150" width="130" height="115" rx="12" stroke="#F87171"/><rect x="845" y="150" width="90" height="115" rx="12" stroke="#2DD4BF"/>
    </g>
    <g text-anchor="middle">
      <text x="110" y="184" fill="#DBEAFE" font-size="16" font-weight="700">1. 문제 정의</text><text x="110" y="211" fill="#BFDBFE" font-size="11">사용자 · 성공 기준 · 위험</text>
      <text x="270" y="184" fill="#EDE9FE" font-size="16" font-weight="700">2. 데이터 검토</text><text x="270" y="211" fill="#DDD6FE" font-size="11">품질 · 권한 · 대표성</text>
      <text x="430" y="184" fill="#D1FAE5" font-size="16" font-weight="700">3. 접근법 선택</text><text x="430" y="211" fill="#A7F3D0" font-size="11">프롬프트 · RAG · 맞춤화</text>
      <text x="590" y="184" fill="#FEF3C7" font-size="16" font-weight="700">4. 평가</text><text x="590" y="211" fill="#FDE68A" font-size="11">품질 · 안전 · 비용</text>
      <text x="750" y="184" fill="#FEE2E2" font-size="16" font-weight="700">5. 배포</text><text x="750" y="211" fill="#FECACA" font-size="11">보호 통제 · 사용자 경험</text>
      <text x="890" y="184" fill="#CCFBF1" font-size="16" font-weight="700">6. 관찰</text><text x="890" y="211" fill="#99F6E4" font-size="11">피드백 · 개선</text>
    </g>
    <g stroke="#CBD5E1" stroke-width="3" marker-end="url(#arrow)"><line x1="175" y1="207" x2="200" y2="207"/><line x1="335" y1="207" x2="360" y2="207"/><line x1="495" y1="207" x2="520" y2="207"/><line x1="655" y1="207" x2="680" y2="207"/><line x1="815" y1="207" x2="840" y2="207"/></g>
    <path d="M890 286 C890 390 115 390 115 286" fill="none" stroke="#2DD4BF" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow)"/>
    <text x="490" y="360" text-anchor="middle" fill="#99F6E4" font-size="14" font-weight="700">운영 피드백은 문제 정의, 데이터, 접근법 선택으로 되돌아갑니다.</text>
    <rect x="155" y="410" width="670" height="45" rx="8" fill="#1E293B" stroke="#64748B"/>
    <text x="490" y="438" text-anchor="middle" fill="#CBD5E1" font-size="13">이 그림은 시험 범위를 확정하는 기준이 아니라, 문서의 개념을 연결하는 실무 학습 보조 자료입니다.</text>
  </g>
</svg>