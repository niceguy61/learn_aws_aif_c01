<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 580" width="100%" height="100%">
  <defs>
    <linearGradient id="glBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="cycleHeader" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
  </defs>

  <rect width="980" height="580" rx="16" fill="url(#glBg)"/>

  <!-- Title -->
  <text x="490" y="38" fill="#F8FAFC" font-size="22" font-weight="bold" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">
    생성형 AI 프로젝트 &amp; 파운데이션 모델(FM) 수명 주기 (AIF-C01 공식)
  </text>
  <text x="490" y="60" fill="#94A3B8" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">
    요구사항 정의(Scope)부터 배포, 정렬(RLHF), 모니터링까지 전 주기 반복적 최적화 프레임워크
  </text>

  <!-- 7 Stages Horizontal Pipeline -->
  <g transform="translate(20, 85)">
    <!-- Stage 1: Scope & Identify -->
    <g transform="translate(0, 0)">
      <rect width="125" height="180" rx="10" fill="#1E293B" stroke="#3B82F6" stroke-width="1.5"/>
      <rect width="125" height="28" rx="10" fill="#1D4ED8"/>
      <rect y="18" width="125" height="10" fill="#1D4ED8"/>
      <text x="62" y="19" fill="#FFFFFF" font-size="11" font-weight="bold" text-anchor="middle" font-family="sans-serif">1. 범위 정의</text>
      <text x="62" y="38" fill="#93C5FD" font-size="9.5" text-anchor="middle" font-family="sans-serif">(Scope &amp; Identify)</text>
      <text x="10" y="60" fill="#F8FAFC" font-size="10" font-weight="bold" font-family="sans-serif">가장 중요한 단계!</text>
      <text x="10" y="78" fill="#94A3B8" font-size="9.5" font-family="sans-serif">• 비즈니스 문제 정의</text>
      <text x="10" y="94" fill="#94A3B8" font-size="9.5" font-family="sans-serif">• 단일 목적 좁게 확정</text>
      <text x="10" y="110" fill="#94A3B8" font-size="9.5" font-family="sans-serif">• ROI 및 KPI 수립</text>
      <rect x="8" y="140" width="109" height="28" rx="6" fill="#0F172A"/>
      <text x="62" y="158" fill="#60A5FA" font-size="9.5" font-weight="bold" text-anchor="middle" font-family="sans-serif">비용·시간 절약</text>
    </g>

    <!-- Arrow 1 to 2 -->
    <polygon points="129,90 137,85 129,80" fill="#60A5FA"/>

    <!-- Stage 2: Select Model -->
    <g transform="translate(138, 0)">
      <rect width="125" height="180" rx="10" fill="#1E293B" stroke="#6366F1" stroke-width="1.5"/>
      <rect width="125" height="28" rx="10" fill="#4338CA"/>
      <rect y="18" width="125" height="10" fill="#4338CA"/>
      <text x="62" y="19" fill="#FFFFFF" font-size="11" font-weight="bold" text-anchor="middle" font-family="sans-serif">2. 모델 선택</text>
      <text x="62" y="38" fill="#C7D2FE" font-size="9.5" text-anchor="middle" font-family="sans-serif">(Select Model)</text>
      <text x="10" y="60" fill="#F8FAFC" font-size="10" font-weight="bold" font-family="sans-serif">FM 선택 기준:</text>
      <text x="10" y="78" fill="#94A3B8" font-size="9.5" font-family="sans-serif">• 모달리티 (텍스트/이미지)</text>
      <text x="10" y="94" fill="#94A3B8" font-size="9.5" font-family="sans-serif">• 컨텍스트 창 크기</text>
      <text x="10" y="110" fill="#94A3B8" font-size="9.5" font-family="sans-serif">• 추론 속도 및 라이선스</text>
      <rect x="8" y="140" width="109" height="28" rx="6" fill="#0F172A"/>
      <text x="62" y="158" fill="#818CF8" font-size="9.5" font-weight="bold" text-anchor="middle" font-family="sans-serif">Bedrock / JumpStart</text>
    </g>

    <!-- Arrow 2 to 3 -->
    <polygon points="267,90 275,85 267,80" fill="#818CF8"/>

    <!-- Stage 3: Adapt & Customize -->
    <g transform="translate(276, 0)">
      <rect width="125" height="180" rx="10" fill="#1E293B" stroke="#8B5CF6" stroke-width="1.5"/>
      <rect width="125" height="28" rx="10" fill="#6D28D9"/>
      <rect y="18" width="125" height="10" fill="#6D28D9"/>
      <text x="62" y="19" fill="#FFFFFF" font-size="11" font-weight="bold" text-anchor="middle" font-family="sans-serif">3. 모델 적응</text>
      <text x="62" y="38" fill="#DDD6FE" font-size="9.5" text-anchor="middle" font-family="sans-serif">(Adaptation)</text>
      <text x="10" y="60" fill="#F8FAFC" font-size="10" font-weight="bold" font-family="sans-serif">스펙트럼 선택:</text>
      <text x="10" y="78" fill="#94A3B8" font-size="9.5" font-family="sans-serif">• 프롬프트 엔지니어링</text>
      <text x="10" y="94" fill="#94A3B8" font-size="9.5" font-family="sans-serif">• RAG (지식베이스)</text>
      <text x="10" y="110" fill="#94A3B8" font-size="9.5" font-family="sans-serif">• Fine-Tuning (PEFT)</text>
      <rect x="8" y="140" width="109" height="28" rx="6" fill="#0F172A"/>
      <text x="62" y="158" fill="#A78BFA" font-size="9.5" font-weight="bold" text-anchor="middle" font-family="sans-serif">도메인 특화 적용</text>
    </g>

    <!-- Arrow 3 to 4 -->
    <polygon points="405,90 413,85 405,80" fill="#A78BFA"/>

    <!-- Stage 4: Align & Augment -->
    <g transform="translate(414, 0)">
      <rect width="125" height="180" rx="10" fill="#1E293B" stroke="#EC4899" stroke-width="1.5"/>
      <rect width="125" height="28" rx="10" fill="#BE185D"/>
      <rect y="18" width="125" height="10" fill="#BE185D"/>
      <text x="62" y="19" fill="#FFFFFF" font-size="11" font-weight="bold" text-anchor="middle" font-family="sans-serif">4. 정렬 &amp; 증강</text>
      <text x="62" y="38" fill="#FCE7F3" font-size="9.5" text-anchor="middle" font-family="sans-serif">(Align &amp; Augment)</text>
      <text x="10" y="60" fill="#F8FAFC" font-size="10" font-weight="bold" font-family="sans-serif">안전 및 인간 정렬:</text>
      <text x="10" y="78" fill="#94A3B8" font-size="9.5" font-family="sans-serif">• HHH 원칙 준수 검증</text>
      <text x="10" y="94" fill="#94A3B8" font-size="9.5" font-family="sans-serif">• RLHF 강화학습</text>
      <text x="10" y="110" fill="#94A3B8" font-size="9.5" font-family="sans-serif">• Guardrails 필터 적용</text>
      <rect x="8" y="140" width="109" height="28" rx="6" fill="#0F172A"/>
      <text x="62" y="158" fill="#F472B6" font-size="9.5" font-weight="bold" text-anchor="middle" font-family="sans-serif">유해성·환각 차단</text>
    </g>

    <!-- Arrow 4 to 5 -->
    <polygon points="543,90 551,85 543,80" fill="#F472B6"/>

    <!-- Stage 5: Evaluation -->
    <g transform="translate(552, 0)">
      <rect width="125" height="180" rx="10" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5"/>
      <rect width="125" height="28" rx="10" fill="#B45309"/>
      <rect y="18" width="125" height="10" fill="#B45309"/>
      <text x="62" y="19" fill="#FFFFFF" font-size="11" font-weight="bold" text-anchor="middle" font-family="sans-serif">5. 정량 평가</text>
      <text x="62" y="38" fill="#FEF3C7" font-size="9.5" text-anchor="middle" font-family="sans-serif">(Evaluation)</text>
      <text x="10" y="60" fill="#F8FAFC" font-size="10" font-weight="bold" font-family="sans-serif">성능 및 벤치마크:</text>
      <text x="10" y="78" fill="#94A3B8" font-size="9.5" font-family="sans-serif">• ROUGE / BLEU 지표</text>
      <text x="10" y="94" fill="#94A3B8" font-size="9.5" font-family="sans-serif">• LLM-as-a-judge</text>
      <text x="10" y="110" fill="#94A3B8" font-size="9.5" font-family="sans-serif">• 인간 평가 (Human loop)</text>
      <rect x="8" y="140" width="109" height="28" rx="6" fill="#0F172A"/>
      <text x="62" y="158" fill="#FBBF24" font-size="9.5" font-weight="bold" text-anchor="middle" font-family="sans-serif">Bedrock FMEval</text>
    </g>

    <!-- Arrow 5 to 6 -->
    <polygon points="681,90 689,85 681,80" fill="#FBBF24"/>

    <!-- Stage 6: Deployment & App Integration -->
    <g transform="translate(690, 0)">
      <rect width="125" height="180" rx="10" fill="#1E293B" stroke="#10B981" stroke-width="1.5"/>
      <rect width="125" height="28" rx="10" fill="#047857"/>
      <rect y="18" width="125" height="10" fill="#047857"/>
      <text x="62" y="19" fill="#FFFFFF" font-size="11" font-weight="bold" text-anchor="middle" font-family="sans-serif">6. 배포 및 통합</text>
      <text x="62" y="38" fill="#D1FAE5" font-size="9.5" text-anchor="middle" font-family="sans-serif">(Deploy &amp; Integrate)</text>
      <text x="10" y="60" fill="#F8FAFC" font-size="10" font-weight="bold" font-family="sans-serif">실시간 서빙:</text>
      <text x="10" y="78" fill="#94A3B8" font-size="9.5" font-family="sans-serif">• 프로비저닝 처리량</text>
      <text x="10" y="94" fill="#94A3B8" font-size="9.5" font-family="sans-serif">• Bedrock Agents 결합</text>
      <text x="10" y="110" fill="#94A3B8" font-size="9.5" font-family="sans-serif">• 스트리밍 응답 (UX)</text>
      <rect x="8" y="140" width="109" height="28" rx="6" fill="#0F172A"/>
      <text x="62" y="158" fill="#34D399" font-size="9.5" font-weight="bold" text-anchor="middle" font-family="sans-serif">API Gateway / App</text>
    </g>

    <!-- Arrow 6 to 7 -->
    <polygon points="819,90 827,85 819,80" fill="#34D399"/>

    <!-- Stage 7: Monitoring & Feedback Loop -->
    <g transform="translate(828, 0)">
      <rect width="112" height="180" rx="10" fill="#1E293B" stroke="#14B8A6" stroke-width="1.5"/>
      <rect width="112" height="28" rx="10" fill="#0F766E"/>
      <rect y="18" width="112" height="10" fill="#0F766E"/>
      <text x="56" y="19" fill="#FFFFFF" font-size="11" font-weight="bold" text-anchor="middle" font-family="sans-serif">7. 모니터링</text>
      <text x="56" y="38" fill="#CCFBF1" font-size="9.5" text-anchor="middle" font-family="sans-serif">(Feedback Loop)</text>
      <text x="10" y="60" fill="#F8FAFC" font-size="10" font-weight="bold" font-family="sans-serif">지속적 관찰:</text>
      <text x="10" y="78" fill="#94A3B8" font-size="9.5" font-family="sans-serif">• 지연시간 / 비용 추적</text>
      <text x="10" y="94" fill="#94A3B8" font-size="9.5" font-family="sans-serif">• 사용자 피드백(👍/👎)</text>
      <text x="10" y="110" fill="#94A3B8" font-size="9.5" font-family="sans-serif">• 드리프트 및 재적응</text>
      <rect x="8" y="140" width="96" height="28" rx="6" fill="#0F172A"/>
      <text x="56" y="158" fill="#2DD4BF" font-size="9.5" font-weight="bold" text-anchor="middle" font-family="sans-serif">CloudWatch / S3</text>
    </g>
  </g>

  <!-- Middle: Key AWS Mappings (Width: 940) -->
  <g transform="translate(20, 290)">
    <rect width="940" height="210" rx="12" fill="#0B1120" stroke="#334155"/>
    <text x="30" y="30" fill="#FF9900" font-size="13" font-weight="bold" font-family="sans-serif">
      ⚙️ 생성형 AI 단계별 핵심 AWS 서비스 &amp; 도구 매핑
    </text>

    <!-- 3 Comparison Columns -->
    <g transform="translate(25, 45)">
      <!-- Col 1 -->
      <rect x="0" y="0" width="280" height="145" rx="8" fill="#1E293B" stroke="#3B82F6"/>
      <text x="15" y="24" fill="#60A5FA" font-size="12" font-weight="bold" font-family="sans-serif">사전 준비 &amp; 모델 선택</text>
      <text x="15" y="48" fill="#E2E8F0" font-size="10.5" font-family="sans-serif">• <tspan font-weight="bold">Amazon Bedrock:</tspan> 선도적 FM 단일 API 접근</text>
      <text x="15" y="68" fill="#E2E8F0" font-size="10.5" font-family="sans-serif">• <tspan font-weight="bold">SageMaker JumpStart:</tspan> 오픈소스 FM 배포</text>
      <text x="15" y="88" fill="#E2E8F0" font-size="10.5" font-family="sans-serif">• <tspan font-weight="bold">PartyRock:</tspan> 코드 없는 빠른 GenAI 프로토타이핑</text>
      <text x="15" y="108" fill="#E2E8F0" font-size="10.5" font-family="sans-serif">• <tspan font-weight="bold">S3 &amp; Glue:</tspan> 큐레이션 데이터 저장 및 정제</text>
      <text x="15" y="128" fill="#94A3B8" font-size="9.5" font-family="sans-serif">전체 토큰 중 고품질 1~3%만 선별 훈련</text>

      <!-- Col 2 -->
      <rect x="305" y="0" width="280" height="145" rx="8" fill="#1E293B" stroke="#8B5CF6"/>
      <text x="320" y="24" fill="#A78BFA" font-size="12" font-weight="bold" font-family="sans-serif">적응, 정렬 &amp; 지식 증강</text>
      <text x="320" y="48" fill="#E2E8F0" font-size="10.5" font-family="sans-serif">• <tspan font-weight="bold">Knowledge Bases:</tspan> 완전 관리형 RAG 구축</text>
      <text x="320" y="68" fill="#E2E8F0" font-size="10.5" font-family="sans-serif">• <tspan font-weight="bold">OpenSearch Serverless:</tspan> 고속 벡터 검색 DB</text>
      <text x="320" y="88" fill="#E2E8F0" font-size="10.5" font-family="sans-serif">• <tspan font-weight="bold">Bedrock Guardrails:</tspan> PII 마스킹 &amp; 유해어 필터</text>
      <text x="320" y="108" fill="#E2E8F0" font-size="10.5" font-family="sans-serif">• <tspan font-weight="bold">Bedrock Fine-Tuning:</tspan> 사내 라벨 데이터 미세조정</text>
      <text x="320" y="128" fill="#94A3B8" font-size="9.5" font-family="sans-serif">HHH(유용성, 정직성, 무해성) 가치 부합</text>

      <!-- Col 3 -->
      <rect x="610" y="0" width="280" height="145" rx="8" fill="#1E293B" stroke="#10B981"/>
      <text x="625" y="24" fill="#34D399" font-size="12" font-weight="bold" font-family="sans-serif">평가, 배포 &amp; 실시간 모니터링</text>
      <text x="625" y="48" fill="#E2E8F0" font-size="10.5" font-family="sans-serif">• <tspan font-weight="bold">Bedrock Model Evaluation:</tspan> 자동 지표 및 평가단</text>
      <text x="625" y="68" fill="#E2E8F0" font-size="10.5" font-family="sans-serif">• <tspan font-weight="bold">Agents for Bedrock:</tspan> Lambda 액션 그룹 자동 실행</text>
      <text x="625" y="88" fill="#E2E8F0" font-size="10.5" font-family="sans-serif">• <tspan font-weight="bold">CloudWatch &amp; CloudTrail:</tspan> 추론 지연 및 API 로깅</text>
      <text x="625" y="108" fill="#E2E8F0" font-size="10.5" font-family="sans-serif">• <tspan font-weight="bold">SageMaker Model Monitor:</tspan> 데이터/개념 드리프트 감지</text>
      <text x="625" y="128" fill="#94A3B8" font-size="9.5" font-family="sans-serif">지속적 성능 재평가 및 피드백 순환</text>
    </g>
  </g>

  <!-- Bottom Notice -->
  <rect x="20" y="520" width="940" height="42" rx="8" fill="#1E293B" stroke="#475569"/>
  <text x="490" y="546" fill="#CBD5E1" font-size="12" text-anchor="middle" font-family="sans-serif">
    💡 <tspan fill="#FF9900" font-weight="bold">시험 가이드 암기 공식:</tspan> 데이터 선택 ➔ 모델 선택 ➔ 사전 훈련 ➔ 미세 조정 ➔ 평가 ➔ 배포 ➔ 피드백의 선형 단계와 반복 루프를 완벽히 숙지해야 합니다.
  </text>
</svg>
