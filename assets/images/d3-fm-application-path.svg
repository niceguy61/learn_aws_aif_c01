<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="title desc">
  <title id="title">파운데이션 모델 애플리케이션 설계 경로</title>
  <desc id="desc">요구 사항 정의에서 모델 선택, 프롬프트 또는 검색 증강, 필요 시 사용자 지정, 평가와 배포까지 이어지는 파운데이션 모델 애플리케이션 설계 경로를 보여 주는 학습용 개념도이다.</desc>
  <rect width="960" height="460" rx="18" fill="#0F172A"/>
  <text x="480" y="42" fill="#F8FAFC" font-size="23" font-weight="700" text-anchor="middle" font-family="sans-serif">파운데이션 모델 애플리케이션 설계 경로</text>
  <text x="480" y="66" fill="#94A3B8" font-size="13" text-anchor="middle" font-family="sans-serif">고정 절차가 아닌 요구 사항을 검증하며 되돌아가는 학습용 설계 지도입니다.</text>
  <g font-family="sans-serif" text-anchor="middle"><g fill="#172554" stroke="#60A5FA" stroke-width="2"><rect x="45" y="175" width="140" height="105" rx="14"/><rect x="225" y="175" width="140" height="105" rx="14"/></g><g fill="#064E3B" stroke="#34D399" stroke-width="2"><rect x="405" y="175" width="140" height="105" rx="14"/></g><g fill="#78350F" stroke="#FCD34D" stroke-width="2"><rect x="585" y="175" width="140" height="105" rx="14"/></g><g fill="#581C87" stroke="#C084FC" stroke-width="2"><rect x="765" y="175" width="150" height="105" rx="14"/></g>
  <g fill="#E2E8F0" font-size="16" font-weight="700"><text x="115" y="210">1. 요구 사항</text><text x="295" y="210">2. 모델 선택</text><text x="475" y="210">3. 적용 방식</text><text x="655" y="210">4. 평가</text><text x="840" y="210">5. 배포·관찰</text></g>
  <g fill="#94A3B8" font-size="12"><text x="115" y="238">모달리티·품질</text><text x="115" y="257">비용·안전·규정</text><text x="295" y="238">성능·지연 시간</text><text x="295" y="257">문맥·라이선스</text><text x="475" y="238">프롬프트·RAG</text><text x="475" y="257">필요 시 사용자 지정</text><text x="655" y="238">자동 지표·인간 검토</text><text x="655" y="257">업무 기준</text><text x="840" y="238">보호 통제·피드백</text><text x="840" y="257">재평가</text></g></g>
  <g stroke="#94A3B8" stroke-width="3" fill="none"><path d="M185 228H225"/><path d="M365 228H405"/><path d="M545 228H585"/><path d="M725 228H765"/><path d="M840 280C840 365 475 385 475 302" stroke-dasharray="8 7"/></g><text x="655" y="390" fill="#CBD5E1" font-size="13" text-anchor="middle" font-family="sans-serif">기준을 충족하지 않으면 모델 선택 또는 적용 방식으로 되돌아가 재평가합니다.</text>
</svg>