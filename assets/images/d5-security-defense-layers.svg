<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="title desc">
  <title id="title">AI 시스템의 심층 방어 계층</title>
  <desc id="desc">자격 증명과 최소 권한, 네트워크 경계, 데이터 보호, 모델과 애플리케이션 보호, 기록과 모니터링을 여러 계층으로 표현한 학습용 보안 개념도이다.</desc>
  <rect width="960" height="480" rx="18" fill="#0F172A"/>
  <text x="480" y="42" fill="#F8FAFC" font-size="23" font-weight="700" text-anchor="middle" font-family="sans-serif">AI 시스템 보호: 심층 방어(Defense in Depth)</text>
  <text x="480" y="66" fill="#94A3B8" font-size="13" text-anchor="middle" font-family="sans-serif">한 통제로 모든 위험을 해결하지 않고, 여러 계층을 조합해 위험을 줄입니다.</text>
  <g font-family="sans-serif" text-anchor="middle"><g><rect x="110" y="115" width="740" height="260" rx="24" fill="#172554" stroke="#60A5FA" stroke-width="2"/><text x="480" y="148" fill="#BFDBFE" font-size="18" font-weight="700">1. 자격 증명·권한</text><text x="480" y="172" fill="#CBD5E1" font-size="13">MFA · 역할 · 최소 권한 · 임시 자격 증명</text></g><g><rect x="165" y="190" width="630" height="150" rx="22" fill="#064E3B" stroke="#34D399" stroke-width="2"/><text x="480" y="222" fill="#A7F3D0" font-size="18" font-weight="700">2. 네트워크·데이터 경계</text><text x="480" y="246" fill="#CBD5E1" font-size="13">프라이빗 연결 · 전송/저장 보호 · 데이터 분류</text></g><g><rect x="235" y="265" width="490" height="115" rx="20" fill="#78350F" stroke="#FCD34D" stroke-width="2"/><text x="480" y="297" fill="#FEF3C7" font-size="18" font-weight="700">3. 애플리케이션·모델 보호</text><text x="480" y="321" fill="#CBD5E1" font-size="13">입력 검증 · 안전 정책 · 비밀 관리 · 취약성 완화</text></g><circle cx="480" cy="385" r="54" fill="#581C87" stroke="#C084FC" stroke-width="3"/><text x="480" y="380" fill="#E9D5FF" font-size="16" font-weight="700">기록·감사</text><text x="480" y="401" fill="#E2E8F0" font-size="11">모니터링·검토</text></g>
</svg>