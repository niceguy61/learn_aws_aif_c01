<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="title desc">
  <title id="title">모델 투명성, 해석 가능성, 설명 가능성의 구분</title>
  <desc id="desc">내부 작동을 직접 이해하기 쉬운 모델부터 복잡한 모델의 출력을 사후 설명하는 접근까지를 보여 주며, 성능·보안·개인정보 요구와 함께 판단해야 함을 설명한다.</desc>
  <rect width="960" height="440" rx="18" fill="#0F172A"/>
  <text x="480" y="42" fill="#F8FAFC" font-size="23" font-weight="700" text-anchor="middle" font-family="sans-serif">투명성 · 해석 가능성 · 설명 가능성</text>
  <text x="480" y="66" fill="#94A3B8" font-size="13" text-anchor="middle" font-family="sans-serif">어느 한쪽이 항상 정답은 아니며, 사용 사례의 규정·성능·보호 요구를 함께 고려합니다.</text>
  <line x1="115" y1="220" x2="845" y2="220" stroke="#94A3B8" stroke-width="5"/><path d="M845 220l-15-9v18z" fill="#94A3B8"/>
  <g font-family="sans-serif" text-anchor="middle"><g transform="translate(105 125)"><rect width="220" height="160" rx="16" fill="#172554" stroke="#60A5FA" stroke-width="2"/><text x="110" y="42" fill="#BFDBFE" font-size="19" font-weight="700">해석 가능성</text><text x="110" y="72" fill="#E2E8F0" font-size="13">구조와 규칙을 직접</text><text x="110" y="93" fill="#E2E8F0" font-size="13">추적하기 쉬운 모델</text><text x="110" y="126" fill="#94A3B8" font-size="12">예: 단순 규칙·선형 관계</text></g><g transform="translate(370 125)"><rect width="220" height="160" rx="16" fill="#064E3B" stroke="#34D399" stroke-width="2"/><text x="110" y="42" fill="#A7F3D0" font-size="19" font-weight="700">설명 가능성</text><text x="110" y="72" fill="#E2E8F0" font-size="13">복잡한 모델의 결과를</text><text x="110" y="93" fill="#E2E8F0" font-size="13">사후 분석으로 설명</text><text x="110" y="126" fill="#94A3B8" font-size="12">입력·출력·기여 요인 점검</text></g><g transform="translate(635 125)"><rect width="220" height="160" rx="16" fill="#78350F" stroke="#FCD34D" stroke-width="2"/><text x="110" y="42" fill="#FEF3C7" font-size="19" font-weight="700">투명성 기록</text><text x="110" y="72" fill="#E2E8F0" font-size="13">목적·한계·위험·</text><text x="110" y="93" fill="#E2E8F0" font-size="13">의사결정 근거 공유</text><text x="110" y="126" fill="#94A3B8" font-size="12">모델 카드·검토 기록 등</text></g></g>
  <text x="480" y="365" fill="#CBD5E1" font-size="14" text-anchor="middle" font-family="sans-serif">시험 판단: “내부 동작을 직접 설명해야 하는가?”, “결과의 이유를 설명하면 충분한가?”를 구분합니다.</text>
</svg>