<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
  </defs>

  <rect width="960" height="480" rx="16" fill="url(#bg5)"/>
  
  <text x="480" y="42" fill="#F8FAFC" font-size="24" font-weight="bold" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">
    Amazon SageMaker 4가지 모델 추론(Inference) 옵션 비교
  </text>
  <text x="480" y="66" fill="#94A3B8" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">
    워크로드 특성, 응답 지연 시간(Latency), 페이로드 크기 및 비용 모델에 따른 선택 (시험 핵심)
  </text>

  <!-- 4 Cards in a Row -->
  <!-- Card 1: Real-time -->
  <g transform="translate(40, 95)">
    <rect width="205" height="345" rx="12" fill="#1E293B" stroke="#EC4899" stroke-width="2"/>
    <rect width="205" height="42" rx="12" fill="#BE185D"/>
    <text x="102" y="27" fill="#FFFFFF" font-size="15" font-weight="bold" text-anchor="middle" font-family="sans-serif">🚀 실시간 (Real-time)</text>
    
    <text x="15" y="70" fill="#F472B6" font-size="12" font-weight="bold" font-family="sans-serif">⏱️ 지연 시간: 밀리초(ms)</text>
    <text x="15" y="90" fill="#CBD5E1" font-size="11" font-family="sans-serif">📦 페이로드: 최대 6MB</text>
    <text x="15" y="110" fill="#CBD5E1" font-size="11" font-family="sans-serif">⏳ 처리 시간: 최대 60초</text>
    
    <rect x="12" y="125" width="181" height="1" fill="#334155"/>
    <text x="15" y="150" fill="#F8FAFC" font-size="12" font-weight="bold" font-family="sans-serif">적합 워크로드:</text>
    <text x="15" y="172" fill="#94A3B8" font-size="11" font-family="sans-serif">• 대화형 웹/모바일 앱</text>
    <text x="15" y="192" fill="#94A3B8" font-size="11" font-family="sans-serif">• 생성형 AI 실시간 스트리밍</text>
    <text x="15" y="212" fill="#94A3B8" font-size="11" font-family="sans-serif">• 지속적이고 안정적인 트래픽</text>

    <rect x="12" y="235" width="181" height="1" fill="#334155"/>
    <text x="15" y="260" fill="#F8FAFC" font-size="12" font-weight="bold" font-family="sans-serif">비용 특징:</text>
    <text x="15" y="280" fill="#E2E8F0" font-size="11" font-family="sans-serif">• 24/7 영구 인스턴스 과금</text>
    <text x="15" y="300" fill="#E2E8F0" font-size="11" font-family="sans-serif">• Auto Scaling 지원</text>
    
    <rect x="12" y="315" width="181" height="24" rx="6" fill="#0F172A"/>
    <text x="102" y="331" fill="#F472B6" font-size="10" font-weight="bold" text-anchor="middle" font-family="sans-serif">지속적 저지연 서비스</text>
  </g>

  <!-- Card 2: Serverless -->
  <g transform="translate(265, 95)">
    <rect width="205" height="345" rx="12" fill="#1E293B" stroke="#10B981" stroke-width="2"/>
    <rect width="205" height="42" rx="12" fill="#047857"/>
    <text x="102" y="27" fill="#FFFFFF" font-size="15" font-weight="bold" text-anchor="middle" font-family="sans-serif">⚡ 서버리스 (Serverless)</text>
    
    <text x="15" y="70" fill="#34D399" font-size="12" font-weight="bold" font-family="sans-serif">⏱️ 지연 시간: 초~밀리초</text>
    <text x="15" y="90" fill="#CBD5E1" font-size="11" font-family="sans-serif">📦 페이로드: 최대 4MB</text>
    <text x="15" y="110" fill="#CBD5E1" font-size="11" font-family="sans-serif">⏳ 처리 시간: 최대 60초</text>
    
    <rect x="12" y="125" width="181" height="1" fill="#334155"/>
    <text x="15" y="150" fill="#F8FAFC" font-size="12" font-weight="bold" font-family="sans-serif">적합 워크로드:</text>
    <text x="15" y="172" fill="#94A3B8" font-size="11" font-family="sans-serif">• 간헐적/불규칙한 요청</text>
    <text x="15" y="192" fill="#94A3B8" font-size="11" font-family="sans-serif">• 인스턴스 관리 부담 제거</text>
    <text x="15" y="212" fill="#94A3B8" font-size="11" font-family="sans-serif">• 개발/테스트 엔드포인트</text>

    <rect x="12" y="235" width="181" height="1" fill="#334155"/>
    <text x="15" y="260" fill="#F8FAFC" font-size="12" font-weight="bold" font-family="sans-serif">비용 특징:</text>
    <text x="15" y="280" fill="#E2E8F0" font-size="11" font-family="sans-serif">• <b>유휴 시 비용 0원</b></text>
    <text x="15" y="300" fill="#E2E8F0" font-size="11" font-family="sans-serif">• 요청 실행 시간(ms) 단위 과금</text>
    
    <rect x="12" y="315" width="181" height="24" rx="6" fill="#0F172A"/>
    <text x="102" y="331" fill="#34D399" font-size="10" font-weight="bold" text-anchor="middle" font-family="sans-serif">트래픽 공백 시 최적</text>
  </g>

  <!-- Card 3: Asynchronous -->
  <g transform="translate(490, 95)">
    <rect width="205" height="345" rx="12" fill="#1E293B" stroke="#3B82F6" stroke-width="2"/>
    <rect width="205" height="42" rx="12" fill="#1D4ED8"/>
    <text x="102" y="27" fill="#FFFFFF" font-size="15" font-weight="bold" text-anchor="middle" font-family="sans-serif">⏳ 비동기식 (Async)</text>
    
    <text x="15" y="70" fill="#60A5FA" font-size="12" font-weight="bold" font-family="sans-serif">⏱️ 지연 시간: 수 초~수 분</text>
    <text x="15" y="90" fill="#CBD5E1" font-size="11" font-family="sans-serif">📦 페이로드: <b>최대 1GB</b></text>
    <text x="15" y="110" fill="#CBD5E1" font-size="11" font-family="sans-serif">⏳ 처리 시간: <b>최대 1시간</b></text>
    
    <rect x="12" y="125" width="181" height="1" fill="#334155"/>
    <text x="15" y="150" fill="#F8FAFC" font-size="12" font-weight="bold" font-family="sans-serif">적합 워크로드:</text>
    <text x="15" y="172" fill="#94A3B8" font-size="11" font-family="sans-serif">• 고해상도 의료/위성 영상</text>
    <text x="15" y="192" fill="#94A3B8" font-size="11" font-family="sans-serif">• 대기열(S3 Queue) 기반 처리</text>
    <text x="15" y="212" fill="#94A3B8" font-size="11" font-family="sans-serif">• 처리 시간 긴 대형 모델</text>

    <rect x="12" y="235" width="181" height="1" fill="#334155"/>
    <text x="15" y="260" fill="#F8FAFC" font-size="12" font-weight="bold" font-family="sans-serif">비용 특징:</text>
    <text x="15" y="280" fill="#E2E8F0" font-size="11" font-family="sans-serif">• <b>인스턴스 0개로 축소 지원</b></text>
    <text x="15" y="300" fill="#E2E8F0" font-size="11" font-family="sans-serif">• 대기열 요청 없을 시 비용 절감</text>
    
    <rect x="12" y="315" width="181" height="24" rx="6" fill="#0F172A"/>
    <text x="102" y="331" fill="#60A5FA" font-size="10" font-weight="bold" text-anchor="middle" font-family="sans-serif">대용량 페이로드 &amp; 대기열</text>
  </g>

  <!-- Card 4: Batch Transform -->
  <g transform="translate(715, 95)">
    <rect width="205" height="345" rx="12" fill="#1E293B" stroke="#F59E0B" stroke-width="2"/>
    <rect width="205" height="42" rx="12" fill="#B45309"/>
    <text x="102" y="27" fill="#FFFFFF" font-size="15" font-weight="bold" text-anchor="middle" font-family="sans-serif">📦 배치 변환 (Batch)</text>
    
    <text x="15" y="70" fill="#FBBF24" font-size="12" font-weight="bold" font-family="sans-serif">⏱️ 지연 시간: 오프라인(수 분~수 시간)</text>
    <text x="15" y="90" fill="#CBD5E1" font-size="11" font-family="sans-serif">📦 페이로드: <b>GB 단위 대용량</b></text>
    <text x="15" y="110" fill="#CBD5E1" font-size="11" font-family="sans-serif">⏳ 처리 시간: 수 시간 일괄 작업</text>
    
    <rect x="12" y="125" width="181" height="1" fill="#334155"/>
    <text x="15" y="150" fill="#F8FAFC" font-size="12" font-weight="bold" font-family="sans-serif">적합 워크로드:</text>
    <text x="15" y="172" fill="#94A3B8" font-size="11" font-family="sans-serif">• 정기적 야간/월간 리포트</text>
    <text x="15" y="192" fill="#94A3B8" font-size="11" font-family="sans-serif">• 결과 즉각 반환 불필요</text>
    <text x="15" y="212" fill="#94A3B8" font-size="11" font-family="sans-serif">• 영구 엔드포인트 불필요</text>

    <rect x="12" y="235" width="181" height="1" fill="#334155"/>
    <text x="15" y="260" fill="#F8FAFC" font-size="12" font-weight="bold" font-family="sans-serif">비용 특징:</text>
    <text x="15" y="280" fill="#E2E8F0" font-size="11" font-family="sans-serif">• <b>최고의 비용 효율성</b></text>
    <text x="15" y="300" fill="#E2E8F0" font-size="11" font-family="sans-serif">• 작업 완료 즉시 인스턴스 종료</text>
    
    <rect x="12" y="315" width="181" height="24" rx="6" fill="#0F172A"/>
    <text x="102" y="331" fill="#FBBF24" font-size="10" font-weight="bold" text-anchor="middle" font-family="sans-serif">대용량 오프라인 일괄 처리</text>
  </g>
</svg>
