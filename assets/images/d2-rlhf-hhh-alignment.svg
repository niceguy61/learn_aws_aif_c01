<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" height="100%">
  <defs>
    <linearGradient id="rlhfBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="step1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#B91C1C" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="step2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1D4ED8" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="step3Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#047857" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="hhhGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
  </defs>

  <rect width="960" height="560" rx="16" fill="url(#rlhfBg)"/>

  <!-- Header -->
  <text x="480" y="38" fill="#F8FAFC" font-size="22" font-weight="bold" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">
    LLM 정렬(Alignment) 프로세스 &amp; 인간 가치 HHH 원칙
  </text>
  <text x="480" y="60" fill="#94A3B8" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">
    인터넷 원시 데이터 사전 훈련 ➔ 지침 미세 조정(SFT) ➔ 인간 피드백 기반 강화학습(RLHF)
  </text>

  <!-- Step 1: Pre-training (Uncontrolled) -->
  <g transform="translate(30, 85)">
    <rect width="250" height="420" rx="14" fill="url(#step1Grad)" stroke="#EF4444" stroke-width="1.5"/>
    <rect width="250" height="36" rx="14" fill="#DC2626"/>
    <rect y="24" width="250" height="12" fill="#DC2626"/>
    <text x="125" y="24" fill="#FFFFFF" font-size="14" font-weight="bold" text-anchor="middle" font-family="sans-serif">1단계: 사전 훈련 (Pre-training)</text>

    <text x="20" y="62" fill="#FCA5A5" font-size="12" font-weight="bold" font-family="sans-serif">데이터: 방대한 웹 텍스트 (Raw)</text>
    <text x="20" y="80" fill="#CBD5E1" font-size="11" font-family="sans-serif">• 인터넷 문서, 서적, 코드 등</text>
    <text x="20" y="96" fill="#CBD5E1" font-size="11" font-family="sans-serif">• 다음 토큰 예측 (Self-Supervised)</text>

    <!-- Raw LLM Box -->
    <rect x="20" y="115" width="210" height="90" rx="10" fill="#1E293B" stroke="#64748B"/>
    <text x="125" y="145" fill="#F8FAFC" font-size="14" font-weight="bold" text-anchor="middle" font-family="sans-serif">기반 파운데이션 모델</text>
    <text x="125" y="165" fill="#94A3B8" font-size="11" text-anchor="middle" font-family="sans-serif">(Base Foundation Model)</text>
    <text x="125" y="185" fill="#F87171" font-size="11" font-weight="bold" text-anchor="middle" font-family="sans-serif">⚠️ 미정렬 (Unaligned)</text>

    <!-- Problems Highlight -->
    <rect x="15" y="225" width="220" height="175" rx="8" fill="#18181B" stroke="#7F1D1D"/>
    <text x="25" y="248" fill="#F87171" font-size="12" font-weight="bold" font-family="sans-serif">🚨 날 것(Raw)의 주요 결함:</text>
    <text x="25" y="272" fill="#FECACA" font-size="11" font-family="sans-serif">• <tspan font-weight="bold">할루시네이션</tspan> (당뇨에 탄수화물?)</text>
    <text x="25" y="292" fill="#FECACA" font-size="11" font-family="sans-serif">• <tspan font-weight="bold">유해성/공격적</tspan> 언어 표출</text>
    <text x="25" y="312" fill="#FECACA" font-size="11" font-family="sans-serif">• 위험 주제 상세 설명 (폭발물 등)</text>
    <text x="25" y="332" fill="#FECACA" font-size="11" font-family="sans-serif">• 단순 텍스트 이어쓰기에 치중</text>
    <text x="25" y="352" fill="#94A3B8" font-size="10.5" font-family="sans-serif">  (질문에 답하지 않고 질문을 이어씀)</text>
    <text x="25" y="380" fill="#FCA5A5" font-size="11" font-weight="bold" font-family="sans-serif">👉 엔터프라이즈 직접 도입 불가</text>
  </g>

  <!-- Arrow 1 to 2 -->
  <g transform="translate(290, 270)">
    <line x1="0" y1="0" x2="35" y2="0" stroke="#60A5FA" stroke-width="3"/>
    <polygon points="35,-6 47,0 35,6" fill="#60A5FA"/>
    <text x="23" y="-12" fill="#93C5FD" font-size="11" font-weight="bold" text-anchor="middle" font-family="sans-serif">지침 튜닝</text>
  </g>

  <!-- Step 2: Instruction Fine-Tuning (SFT) -->
  <g transform="translate(345, 85)">
    <rect width="255" height="420" rx="14" fill="url(#step2Grad)" stroke="#3B82F6" stroke-width="1.5"/>
    <rect width="255" height="36" rx="14" fill="#2563EB"/>
    <rect y="24" width="255" height="12" fill="#2563EB"/>
    <text x="127" y="24" fill="#FFFFFF" font-size="14" font-weight="bold" text-anchor="middle" font-family="sans-serif">2단계: 지침 미세 조정 (SFT)</text>

    <text x="20" y="62" fill="#93C5FD" font-size="12" font-weight="bold" font-family="sans-serif">데이터: 고품질 질의-응답 쌍</text>
    <text x="20" y="80" fill="#CBD5E1" font-size="11" font-family="sans-serif">• 사람이 작성한 정답 데이터셋</text>
    <text x="20" y="96" fill="#CBD5E1" font-size="11" font-family="sans-serif">• 지시(Prompt) ➔ 완성(Completion)</text>

    <!-- Dialog Mockup -->
    <rect x="15" y="115" width="225" height="135" rx="8" fill="#090D16" stroke="#334155"/>
    <text x="23" y="135" fill="#60A5FA" font-size="10.5" font-weight="bold" font-family="sans-serif">Prompt (지침):</text>
    <text x="23" y="152" fill="#E2E8F0" font-size="10.5" font-family="sans-serif">"AWS Lambda의 최대 실행 시간은?"</text>
    <line x1="23" y1="164" x2="230" y2="164" stroke="#1E293B"/>
    <text x="23" y="182" fill="#34D399" font-size="10.5" font-weight="bold" font-family="sans-serif">Target Response (목표 응답):</text>
    <text x="23" y="200" fill="#E2E8F0" font-size="10.5" font-family="sans-serif">"AWS Lambda의 최대 실행 제한은</text>
    <text x="23" y="218" fill="#E2E8F0" font-size="10.5" font-family="sans-serif"> 15분(900초)입니다."</text>
    <text x="23" y="238" fill="#FBBF24" font-size="9.5" font-family="sans-serif">➔ 대화형 Q&amp;A 태스크 패턴 학습 완료</text>

    <!-- Step 2 Benefits -->
    <rect x="15" y="265" width="225" height="135" rx="8" fill="#1E293B" stroke="#1D4ED8"/>
    <text x="25" y="290" fill="#60A5FA" font-size="12" font-weight="bold" font-family="sans-serif">✨ 효과 및 개선점:</text>
    <text x="25" y="312" fill="#E2E8F0" font-size="11" font-family="sans-serif">• 질문에 적절히 응답하는 태도 형성</text>
    <text x="25" y="332" fill="#E2E8F0" font-size="11" font-family="sans-serif">• 사전 훈련 대비 자연스러운 대화</text>
    <text x="25" y="352" fill="#FCA5A5" font-size="11" font-family="sans-serif">⚠️ 여전히 미묘한 편향, 미확인된</text>
    <text x="25" y="370" fill="#FCA5A5" font-size="11" font-family="sans-serif">   위험 지침에 무비판적 응답 가능</text>
  </g>

  <!-- Arrow 2 to 3 -->
  <g transform="translate(610, 270)">
    <line x1="0" y1="0" x2="35" y2="0" stroke="#34D399" stroke-width="3"/>
    <polygon points="35,-6 47,0 35,6" fill="#34D399"/>
    <text x="23" y="-12" fill="#6EE7B7" font-size="11" font-weight="bold" text-anchor="middle" font-family="sans-serif">RLHF 피드백</text>
  </g>

  <!-- Step 3: RLHF & HHH Alignment -->
  <g transform="translate(665, 85)">
    <rect width="265" height="420" rx="14" fill="url(#step3Grad)" stroke="#10B981" stroke-width="1.5"/>
    <rect width="265" height="36" rx="14" fill="#059669"/>
    <rect y="24" width="265" height="12" fill="#059669"/>
    <text x="132" y="24" fill="#FFFFFF" font-size="14" font-weight="bold" text-anchor="middle" font-family="sans-serif">3단계: RLHF &amp; HHH 원칙 정렬</text>

    <!-- HHH Banner -->
    <rect x="15" y="50" width="235" height="68" rx="8" fill="url(#hhhGrad)"/>
    <text x="132" y="70" fill="#FFFFFF" font-size="12" font-weight="bold" text-anchor="middle" font-family="sans-serif">⭐ 인간 핵심 가치 3대 원칙 (HHH)</text>
    <text x="25" y="90" fill="#FDF2F8" font-size="10.5" font-family="sans-serif">• <tspan font-weight="bold">유용성 (Helpfulness):</tspan> 요청 명확히 해결</text>
    <text x="25" y="106" fill="#FDF2F8" font-size="10.5" font-family="sans-serif">• <tspan font-weight="bold">정직성 (Honesty):</tspan> 사실성·할루시네이션 방지</text>
    <text x="25" y="122" fill="#FDF2F8" font-size="10.5" font-family="sans-serif">• <tspan font-weight="bold">무해성 (Harmlessness):</tspan> 범죄·차별 유해 거부</text>

    <!-- RLHF Mechanism -->
    <rect x="15" y="130" width="235" height="175" rx="8" fill="#1E293B" stroke="#059669"/>
    <text x="25" y="152" fill="#6EE7B7" font-size="11.5" font-weight="bold" font-family="sans-serif">🔄 RLHF 작동 루프 (Reinforcement):</text>
    <text x="25" y="174" fill="#E2E8F0" font-size="10.5" font-family="sans-serif">1. 모델이 동일 질의에 다중 답변 생성</text>
    <text x="25" y="194" fill="#E2E8F0" font-size="10.5" font-family="sans-serif">2. 인간 검수자가 HHH 기준으로 순위 매김</text>
    <text x="25" y="214" fill="#FBBF24" font-size="10.5" font-family="sans-serif">3. 보상 모델 (Reward Model) 훈련</text>
    <text x="25" y="234" fill="#E2E8F0" font-size="10.5" font-family="sans-serif">4. PPO 알고리즘으로 정책 가중치 업데이트</text>
    <text x="25" y="254" fill="#93C5FD" font-size="10.5" font-weight="bold" font-family="sans-serif">➔ 유해 요청 거부, 안전한 답변 생성</text>

    <!-- Final Result Badge -->
    <rect x="15" y="320" width="235" height="85" rx="8" fill="#064E3B" stroke="#34D399"/>
    <text x="132" y="345" fill="#A7F3D0" font-size="12" font-weight="bold" text-anchor="middle" font-family="sans-serif">🛡️ 최종 결과: 안전 정렬된 LLM</text>
    <text x="132" y="365" fill="#ECFDF5" font-size="10.5" text-anchor="middle" font-family="sans-serif">Amazon Titan, Claude 3, Llama Guard</text>
    <text x="132" y="385" fill="#FDE047" font-size="10.5" font-weight="bold" text-anchor="middle" font-family="sans-serif">ROUGE / BLEU / FMEval 평가 통과</text>
  </g>

  <!-- Bottom Bar -->
  <rect x="30" y="515" width="900" height="35" rx="8" fill="#1E293B" stroke="#475569"/>
  <text x="480" y="537" fill="#CBD5E1" font-size="11.5" text-anchor="middle" font-family="sans-serif">
    💡 <tspan fill="#FF9900" font-weight="bold">AIF-C01 핵심:</tspan> HHH 원칙은 영역 2의 모델 미세조정뿐만 아니라 <tspan fill="#60A5FA" font-weight="bold">도메인 4(책임감 있는 AI)</tspan>의 거버넌스 핵심 평가 기준과 직결됩니다.
  </text>
</svg>
