<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1D4ED8" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="mlGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#047857" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="dlGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#B45309" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="genGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EC4899" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="500" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Header Title -->
  <text x="450" y="42" fill="#F8FAFC" font-size="22" font-weight="bold" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">
    AI · ML · 딥러닝 · 생성형 AI 계층 구조 (AIF-C01 핵심 개념)
  </text>
  <text x="450" y="66" fill="#94A3B8" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">
    범위: AI ⊃ ML ⊃ Deep Learning ⊃ Generative AI
  </text>

  <!-- Level 1: AI Container -->
  <rect x="50" y="90" width="800" height="370" rx="20" fill="url(#aiGrad)" stroke="#3B82F6" stroke-width="2" filter="url(#cardShadow)"/>
  <rect x="70" y="105" width="220" height="32" rx="8" fill="#1E3A8A"/>
  <text x="80" y="126" fill="#60A5FA" font-size="14" font-weight="bold" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    🤖 인공지능 (AI)
  </text>
  <text x="760" y="126" fill="#93C5FD" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="end">
    인간 지능(학습, 추론, 인식) 모방 컴퓨터 과학
  </text>

  <!-- Level 2: ML Container -->
  <rect x="90" y="150" width="720" height="290" rx="16" fill="url(#mlGrad)" stroke="#10B981" stroke-width="2"/>
  <rect x="110" y="165" width="200" height="30" rx="8" fill="#064E3B"/>
  <text x="120" y="185" fill="#34D399" font-size="13" font-weight="bold" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    📊 머신러닝 (ML)
  </text>
  <text x="780" y="185" fill="#A7F3D0" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="end">
    데이터 패턴 학습을 통한 예측 알고리즘 (특성 공학 필요)
  </text>

  <!-- Level 3: DL Container -->
  <rect x="130" y="210" width="640" height="210" rx="14" fill="url(#dlGrad)" stroke="#F59E0B" stroke-width="2"/>
  <rect x="150" y="225" width="180" height="28" rx="8" fill="#78350F"/>
  <text x="160" y="244" fill="#FCD34D" font-size="13" font-weight="bold" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    🧠 딥러닝 (Deep Learning)
  </text>
  <text x="740" y="244" fill="#FDE68A" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="end">
    다층 인공신경망으로 특징 자율 추출 (비정형 데이터)
  </text>

  <!-- Level 4: GenAI Core Box -->
  <rect x="170" y="275" width="560" height="125" rx="12" fill="url(#genGrad)" stroke="#FFFFFF" stroke-width="2" filter="url(#cardShadow)"/>
  <text x="450" y="310" fill="#FFFFFF" font-size="18" font-weight="bold" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">
    ✨ 생성형 AI (Generative AI)
  </text>
  <text x="450" y="335" fill="#F3E8FF" font-size="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">
    프롬프트를 기반으로 새로운 독창적 콘텐츠(텍스트, 이미지, 코드, 음악) 창작
  </text>
  <rect x="230" y="352" width="440" height="34" rx="17" fill="#0F172A" fill-opacity="0.6"/>
  <text x="450" y="374" fill="#E9D5FF" font-size="12" font-weight="bold" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">
    AWS 핵심 서비스: Amazon Bedrock · Titan · SageMaker JumpStart
  </text>
</svg>
