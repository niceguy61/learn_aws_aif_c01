<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="100%" height="100%">
  <defs>
    <linearGradient id="diffBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="forwardGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
    <linearGradient id="reverseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="latentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <rect width="960" height="580" rx="16" fill="url(#diffBg)"/>

  <!-- Title -->
  <text x="480" y="38" fill="#F8FAFC" font-size="22" font-weight="bold" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">
    확산 모델(Diffusion Model) 원리와 잠재 공간(Latent Space) 아키텍처
  </text>
  <text x="480" y="60" fill="#94A3B8" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">
    순방향 노이즈 주입 ➔ 역방향 노이즈 제거(U-Net) ➔ 텍스트 프롬프트(CLIP) 기반 고해상도 멀티모달 이미지 생성
  </text>

  <!-- Diffusion Process Visual (Top: Width 900) -->
  <g transform="translate(30, 85)">
    <rect width="900" height="235" rx="12" fill="#0B1120" stroke="#334155"/>
    <text x="25" y="26" fill="#F8FAFC" font-size="13" font-weight="bold" font-family="sans-serif">
      🔄 확산 모델의 2단계 프로세스: 순방향 확산 vs 역방향 확산
    </text>

    <!-- Forward Process -->
    <g transform="translate(25, 45)">
      <rect width="400" height="165" rx="8" fill="#1E293B" stroke="#3B82F6"/>
      <text x="15" y="24" fill="#60A5FA" font-size="12" font-weight="bold" font-family="sans-serif">1. 순방향 확산 (Forward Process: 학습 단계)</text>
      <text x="15" y="42" fill="#94A3B8" font-size="10.5" font-family="sans-serif">원본 이미지에 가우스(Gaussian) 노이즈를 단계별로 점진적 주입</text>

      <!-- Step sequence -->
      <g transform="translate(15, 60)">
        <!-- Original image box -->
        <rect x="0" y="0" width="70" height="65" rx="6" fill="#1E3A8A" stroke="#3B82F6"/>
        <text x="35" y="30" fill="#93C5FD" font-size="11" font-weight="bold" text-anchor="middle" font-family="sans-serif">선명한 원본</text>
        <text x="35" y="48" fill="#CBD5E1" font-size="9.5" text-anchor="middle" font-family="sans-serif">(x₀)</text>

        <text x="90" y="35" fill="#60A5FA" font-size="14" font-weight="bold">→</text>

        <!-- Noisy image 1 -->
        <rect x="110" y="0" width="70" height="65" rx="6" fill="#334155" stroke="#64748B"/>
        <text x="145" y="30" fill="#E2E8F0" font-size="10" text-anchor="middle" font-family="sans-serif">노이즈 추가</text>
        <text x="145" y="48" fill="#94A3B8" font-size="9.5" text-anchor="middle" font-family="sans-serif">(x_t)</text>

        <text x="200" y="35" fill="#60A5FA" font-size="14" font-weight="bold">→</text>

        <!-- Pure noise -->
        <rect x="220" y="0" width="80" height="65" rx="6" fill="#18181B" stroke="#71717A" stroke-dasharray="4"/>
        <text x="260" y="30" fill="#A1A1AA" font-size="10" font-weight="bold" text-anchor="middle" font-family="sans-serif">완전한 노이즈</text>
        <text x="260" y="48" fill="#71717A" font-size="9.5" text-anchor="middle" font-family="sans-serif">(x_T: Pure Noise)</text>
      </g>

      <text x="15" y="150" fill="#CBD5E1" font-size="10" font-family="sans-serif">➔ 수학적으로 명확한 정규분포 노이즈 주입 (신경망 불필요)</text>
    </g>

    <!-- Reverse Process -->
    <g transform="translate(455, 45)">
      <rect width="420" height="165" rx="8" fill="#1E293B" stroke="#10B981"/>
      <text x="15" y="24" fill="#34D399" font-size="12" font-weight="bold" font-family="sans-serif">2. 역방향 확산 (Reverse Process: 생성/추론 단계)</text>
      <text x="15" y="42" fill="#94A3B8" font-size="10.5" font-family="sans-serif">랜덤 노이즈에서 노이즈 예측 신경망(U-Net)으로 노이즈를 걷어냄</text>

      <!-- Step sequence -->
      <g transform="translate(15, 60)">
        <!-- Pure noise -->
        <rect x="0" y="0" width="75" height="65" rx="6" fill="#18181B" stroke="#71717A" stroke-dasharray="4"/>
        <text x="37" y="30" fill="#A1A1AA" font-size="10" text-anchor="middle" font-family="sans-serif">랜덤 노이즈</text>
        <text x="37" y="48" fill="#71717A" font-size="9.5" text-anchor="middle" font-family="sans-serif">(Start)</text>

        <text x="95" y="35" fill="#34D399" font-size="14" font-weight="bold">→</text>

        <!-- U-Net Denoising Engine -->
        <rect x="115" y="0" width="135" height="65" rx="6" fill="#064E3B" stroke="#10B981"/>
        <text x="182" y="25" fill="#34D399" font-size="10.5" font-weight="bold" text-anchor="middle" font-family="sans-serif">U-Net 디노이저</text>
        <text x="182" y="42" fill="#A7F3D0" font-size="9.5" text-anchor="middle" font-family="sans-serif">+ 텍스트 프롬프트</text>
        <text x="182" y="56" fill="#FDE047" font-size="9" text-anchor="middle" font-family="sans-serif">(CLIP 텍스트 임베딩)</text>

        <text x="270" y="35" fill="#34D399" font-size="14" font-weight="bold">→</text>

        <!-- Final generated image -->
        <rect x="290" y="0" width="85" height="65" rx="6" fill="#047857" stroke="#34D399"/>
        <text x="332" y="28" fill="#FFFFFF" font-size="10.5" font-weight="bold" text-anchor="middle" font-family="sans-serif">완성된 이미지</text>
        <text x="332" y="45" fill="#D1FAE5" font-size="9.5" text-anchor="middle" font-family="sans-serif">(고품질 합성)</text>
      </g>

      <text x="15" y="150" fill="#34D399" font-size="10" font-weight="bold" font-family="sans-serif">➔ Stable Diffusion, Amazon Titan Image Generator의 생성 메커니즘</text>
    </g>
  </g>

  <!-- Bottom: Stable Diffusion Latent Space Innovation + 3 Model Comparison -->
  <g transform="translate(30, 335)">
    <!-- Latent Space Box -->
    <g transform="translate(0, 0)">
      <rect width="440" height="175" rx="10" fill="url(#latentGrad)" stroke="#8B5CF6" stroke-width="1.5"/>
      <text x="20" y="26" fill="#DDD6FE" font-size="13" font-weight="bold" font-family="sans-serif">
        💡 Stable Diffusion의 혁신: 잠재 공간 (Latent Space)
      </text>
      <text x="20" y="50" fill="#CBD5E1" font-size="11" font-family="sans-serif">
        • 일반 확산 모델: 원본 픽셀 공간(Pixel Space) 연산 ➔ 극심한 연산 비용
      </text>
      <text x="20" y="72" fill="#CBD5E1" font-size="11" font-family="sans-serif">
        • <tspan fill="#F472B6" font-weight="bold">Stable Diffusion:</tspan> VAE 인코더로 압축된 <tspan fill="#F472B6" font-weight="bold">잠재 공간(Latent Space)</tspan>에서 디노이징
      </text>
      <text x="20" y="94" fill="#CBD5E1" font-size="11" font-family="sans-serif">
        • 연산량 대폭 절감 ➔ 일반 GPU 인스턴스에서도 초고속 생성 가능
      </text>
      <text x="20" y="116" fill="#CBD5E1" font-size="11" font-family="sans-serif">
        • AWS 지원: <tspan fill="#FF9900" font-weight="bold">SageMaker JumpStart</tspan> &amp; <tspan fill="#FF9900" font-weight="bold">Amazon Bedrock</tspan>에서 즉시 활용
      </text>
      <rect x="20" y="135" width="400" height="26" rx="5" fill="#1E293B"/>
      <text x="220" y="152" fill="#C4B5FD" font-size="10.5" font-weight="bold" text-anchor="middle" font-family="sans-serif">
        픽셀 공간 512x512 ➔ 잠재 공간 64x64 축소 연산 (메모리 절감)
      </text>
    </g>

    <!-- 3 Models Compared Box -->
    <g transform="translate(460, 0)">
      <rect width="440" height="175" rx="10" fill="#1E293B" stroke="#475569"/>
      <text x="20" y="26" fill="#F8FAFC" font-size="13" font-weight="bold" font-family="sans-serif">
        📊 생성형 이미지 모델 3대 아키텍처 비교 (시험 빈출)
      </text>

      <!-- Table Header -->
      <g transform="translate(15, 38)">
        <rect width="410" height="24" rx="4" fill="#334155"/>
        <text x="50" y="16" fill="#F8FAFC" font-size="10.5" font-weight="bold" text-anchor="middle" font-family="sans-serif">모델 유형</text>
        <text x="180" y="16" fill="#F8FAFC" font-size="10.5" font-weight="bold" text-anchor="middle" font-family="sans-serif">작동 핵심</text>
        <text x="330" y="16" fill="#F8FAFC" font-size="10.5" font-weight="bold" text-anchor="middle" font-family="sans-serif">특징 및 한계</text>

        <!-- Row 1: VAE -->
        <text x="50" y="42" fill="#93C5FD" font-size="10" font-weight="bold" text-anchor="middle" font-family="sans-serif">VAE</text>
        <text x="180" y="42" fill="#CBD5E1" font-size="9.5" text-anchor="middle" font-family="sans-serif">인코더-잠재분포-디코더</text>
        <text x="330" y="42" fill="#94A3B8" font-size="9.5" text-anchor="middle" font-family="sans-serif">흐릿한(Blurry) 출력 한계</text>

        <!-- Row 2: GAN -->
        <text x="50" y="68" fill="#FCD34D" font-size="10" font-weight="bold" text-anchor="middle" font-family="sans-serif">GAN</text>
        <text x="180" y="68" fill="#CBD5E1" font-size="9.5" text-anchor="middle" font-family="sans-serif">생성자 vs 판별자 경쟁</text>
        <text x="330" y="68" fill="#FCA5A5" font-size="9.5" text-anchor="middle" font-family="sans-serif">훈련 불안정(모드 붕괴)</text>

        <!-- Row 3: Diffusion -->
        <text x="50" y="94" fill="#34D399" font-size="10" font-weight="bold" text-anchor="middle" font-family="sans-serif">확산 모델</text>
        <text x="180" y="94" fill="#E2E8F0" font-size="9.5" font-weight="bold" text-anchor="middle" font-family="sans-serif">노이즈 점진적 제거(Denoise)</text>
        <text x="330" y="94" fill="#34D399" font-size="9.5" font-weight="bold" text-anchor="middle" font-family="sans-serif">최고 품질·안정적 훈련</text>
      </g>
    </g>
  </g>

  <!-- Bottom Bar -->
  <rect x="30" y="525" width="900" height="35" rx="6" fill="#0F172A" stroke="#334155"/>
  <text x="480" y="547" fill="#CBD5E1" font-size="11.5" text-anchor="middle" font-family="sans-serif">
    💡 <tspan fill="#FF9900" font-weight="bold">AIF-C01 핵심 포인트:</tspan> 확산 모델은 노이즈 제거(Denoising)를 역방향으로 학습하며, Stable Diffusion은 연산 효율을 위해 <tspan fill="#F472B6" font-weight="bold">잠재 공간(Latent Space)</tspan>을 사용합니다.
  </text>
</svg>
