<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bedBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="bedHeader" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF9900"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="fmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>

  <rect width="960" height="600" rx="16" fill="url(#bedBg)"/>

  <!-- Title -->
  <text x="480" y="38" fill="#F8FAFC" font-size="22" font-weight="bold" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">
    Amazon Bedrock 엔터프라이즈 생성형 AI 에코시스템
  </text>
  <text x="480" y="60" fill="#94A3B8" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">
    단일 API로 선도적인 파운데이션 모델(FM)을 서버리스로 활용하고 강력한 보안·에이전트·RAG 기능을 결합하는 통합 플랫폼
  </text>

  <!-- Top: Foundation Models Ribbon -->
  <g transform="translate(40, 85)">
    <rect width="880" height="110" rx="12" fill="#1E293B" stroke="#FF9900" stroke-width="1.5"/>
    <text x="25" y="28" fill="#FF9900" font-size="13" font-weight="bold" font-family="sans-serif">
      🤖 다양한 선도적 파운데이션 모델 (Choice of Leading FMs via Single API)
    </text>

    <!-- 6 Model Cards -->
    <g transform="translate(20, 42)">
      <!-- Anthropic -->
      <rect x="0" y="0" width="130" height="52" rx="8" fill="#0F172A" stroke="#475569"/>
      <text x="65" y="22" fill="#F8FAFC" font-size="12" font-weight="bold" text-anchor="middle" font-family="sans-serif">Anthropic</text>
      <text x="65" y="40" fill="#93C5FD" font-size="10" text-anchor="middle" font-family="sans-serif">Claude 3 / 3.5</text>

      <!-- Meta -->
      <rect x="142" y="0" width="130" height="52" rx="8" fill="#0F172A" stroke="#475569"/>
      <text x="207" y="22" fill="#F8FAFC" font-size="12" font-weight="bold" text-anchor="middle" font-family="sans-serif">Meta</text>
      <text x="207" y="40" fill="#60A5FA" font-size="10" text-anchor="middle" font-family="sans-serif">Llama 2 / 3</text>

      <!-- Amazon Titan -->
      <rect x="284" y="0" width="130" height="52" rx="8" fill="#0F172A" stroke="#FF9900"/>
      <text x="349" y="22" fill="#FF9900" font-size="12" font-weight="bold" text-anchor="middle" font-family="sans-serif">Amazon</text>
      <text x="349" y="40" fill="#FDE047" font-size="10" text-anchor="middle" font-family="sans-serif">Titan Text / Image</text>

      <!-- AI21 Labs -->
      <rect x="426" y="0" width="130" height="52" rx="8" fill="#0F172A" stroke="#475569"/>
      <text x="491" y="22" fill="#F8FAFC" font-size="12" font-weight="bold" text-anchor="middle" font-family="sans-serif">AI21 Labs</text>
      <text x="491" y="40" fill="#A78BFA" font-size="10" text-anchor="middle" font-family="sans-serif">Jurassic-2</text>

      <!-- Cohere -->
      <rect x="568" y="0" width="130" height="52" rx="8" fill="#0F172A" stroke="#475569"/>
      <text x="633" y="22" fill="#F8FAFC" font-size="12" font-weight="bold" text-anchor="middle" font-family="sans-serif">Cohere</text>
      <text x="633" y="40" fill="#34D399" font-size="10" text-anchor="middle" font-family="sans-serif">Command / Embed</text>

      <!-- Stability AI -->
      <rect x="710" y="0" width="130" height="52" rx="8" fill="#0F172A" stroke="#475569"/>
      <text x="775" y="22" fill="#F8FAFC" font-size="12" font-weight="bold" text-anchor="middle" font-family="sans-serif">Stability AI</text>
      <text x="775" y="40" fill="#F472B6" font-size="10" text-anchor="middle" font-family="sans-serif">Stable Diffusion XL</text>
    </g>
  </g>

  <!-- Middle: 4 Bedrock Native Capabilities -->
  <g transform="translate(40, 215)">
    <!-- 1. Knowledge Bases (RAG) -->
    <g transform="translate(0, 0)">
      <rect width="205" height="235" rx="12" fill="#1E293B" stroke="#3B82F6" stroke-width="1.5"/>
      <rect width="205" height="34" rx="12" fill="#1D4ED8"/>
      <rect y="22" width="205" height="12" fill="#1D4ED8"/>
      <text x="102" y="22" fill="#FFFFFF" font-size="13" font-weight="bold" text-anchor="middle" font-family="sans-serif">Knowledge Bases (RAG)</text>

      <text x="15" y="55" fill="#93C5FD" font-size="11.5" font-weight="bold" font-family="sans-serif">사내 문서 지식 증강</text>
      <text x="15" y="75" fill="#CBD5E1" font-size="10.5" font-family="sans-serif">• S3 문서 자동 임베딩</text>
      <text x="15" y="93" fill="#CBD5E1" font-size="10.5" font-family="sans-serif">• OpenSearch Serverless 연계</text>
      <text x="15" y="111" fill="#CBD5E1" font-size="10.5" font-family="sans-serif">• 시맨틱 유사도 벡터 검색</text>
      <text x="15" y="129" fill="#CBD5E1" font-size="10.5" font-family="sans-serif">• 출처 인용(Citations) 자동 반환</text>
      <text x="15" y="147" fill="#34D399" font-size="10.5" font-weight="bold" font-family="sans-serif">➔ 코드 없이 완전 관리형 구축</text>

      <rect x="15" y="185" width="175" height="35" rx="6" fill="#0F172A"/>
      <text x="102" y="207" fill="#60A5FA" font-size="10.5" text-anchor="middle" font-family="sans-serif">최신성 유지 &amp; 할루시네이션 억제</text>
    </g>

    <!-- 2. Agents for Bedrock -->
    <g transform="translate(225, 0)">
      <rect width="205" height="235" rx="12" fill="#1E293B" stroke="#10B981" stroke-width="1.5"/>
      <rect width="205" height="34" rx="12" fill="#047857"/>
      <rect y="22" width="205" height="12" fill="#047857"/>
      <text x="102" y="22" fill="#FFFFFF" font-size="13" font-weight="bold" text-anchor="middle" font-family="sans-serif">Agents for Bedrock</text>

      <text x="15" y="55" fill="#6EE7B7" font-size="11.5" font-weight="bold" font-family="sans-serif">다단계 자율 작업 수행</text>
      <text x="15" y="75" fill="#CBD5E1" font-size="10.5" font-family="sans-serif">• 자연어 요청 분석 및 추론</text>
      <text x="15" y="93" fill="#CBD5E1" font-size="10.5" font-family="sans-serif">• 작업 분해(ReAct 프레임워크)</text>
      <text x="15" y="111" fill="#CBD5E1" font-size="10.5" font-family="sans-serif">• Action Group: AWS Lambda 호출</text>
      <text x="15" y="129" fill="#CBD5E1" font-size="10.5" font-family="sans-serif">• 사내 DB/외부 API 직접 연동</text>
      <text x="15" y="147" fill="#34D399" font-size="10.5" font-weight="bold" font-family="sans-serif">➔ 단순 답변 넘어 '실행' 수행</text>

      <rect x="15" y="185" width="175" height="35" rx="6" fill="#0F172A"/>
      <text x="102" y="207" fill="#34D399" font-size="10.5" text-anchor="middle" font-family="sans-serif">항공권 예약, 주문 취소, DB 조회</text>
    </g>

    <!-- 3. Guardrails for Bedrock -->
    <g transform="translate(450, 0)">
      <rect width="205" height="235" rx="12" fill="#1E293B" stroke="#EF4444" stroke-width="1.5"/>
      <rect width="205" height="34" rx="12" fill="#B91C1C"/>
      <rect y="22" width="205" height="12" fill="#B91C1C"/>
      <text x="102" y="22" fill="#FFFFFF" font-size="13" font-weight="bold" text-anchor="middle" font-family="sans-serif">Guardrails for Bedrock</text>

      <text x="15" y="55" fill="#FCA5A5" font-size="11.5" font-weight="bold" font-family="sans-serif">책임감 있는 AI &amp; 안전 필터</text>
      <text x="15" y="75" fill="#CBD5E1" font-size="10.5" font-family="sans-serif">• 유해 콘텐츠 및 혐오 발언 차단</text>
      <text x="15" y="93" fill="#CBD5E1" font-size="10.5" font-family="sans-serif">• 거부 주제(Denied Topics) 정의</text>
      <text x="15" y="111" fill="#CBD5E1" font-size="10.5" font-family="sans-serif">• 개인식별정보(PII) 마스킹/차단</text>
      <text x="15" y="129" fill="#CBD5E1" font-size="10.5" font-family="sans-serif">• 프롬프트 주입 공격 방어</text>
      <text x="15" y="147" fill="#F87171" font-size="10.5" font-weight="bold" font-family="sans-serif">➔ 다중 모델에 동일 안전 규칙 적용</text>

      <rect x="15" y="185" width="175" height="35" rx="6" fill="#0F172A"/>
      <text x="102" y="207" fill="#F87171" font-size="10.5" text-anchor="middle" font-family="sans-serif">규제 준수 및 기업 브랜드 보호</text>
    </g>

    <!-- 4. Model Evaluation & Customization -->
    <g transform="translate(675, 0)">
      <rect width="205" height="235" rx="12" fill="#1E293B" stroke="#8B5CF6" stroke-width="1.5"/>
      <rect width="205" height="34" rx="12" fill="#6D28D9"/>
      <rect y="22" width="205" height="12" fill="#6D28D9"/>
      <text x="102" y="22" fill="#FFFFFF" font-size="12.5" font-weight="bold" text-anchor="middle" font-family="sans-serif">Model Evaluation &amp; Custom</text>

      <text x="15" y="55" fill="#C4B5FD" font-size="11.5" font-weight="bold" font-family="sans-serif">평가 및 미세 조정</text>
      <text x="15" y="75" fill="#CBD5E1" font-size="10.5" font-family="sans-serif">• 자동 평가 (정확도, 유해성, 견고성)</text>
      <text x="15" y="93" fill="#CBD5E1" font-size="10.5" font-family="sans-serif">• 인간 참여형 평가(Human Review)</text>
      <text x="15" y="111" fill="#CBD5E1" font-size="10.5" font-family="sans-serif">• Fine-Tuning 지원 (Titan, Llama)</text>
      <text x="15" y="129" fill="#CBD5E1" font-size="10.5" font-family="sans-serif">• Continued Pre-training 지원</text>
      <text x="15" y="147" fill="#A78BFA" font-size="10.5" font-weight="bold" font-family="sans-serif">➔ 정량 지표 기반 최적 모델 선택</text>

      <rect x="15" y="185" width="175" height="35" rx="6" fill="#0F172A"/>
      <text x="102" y="207" fill="#A78BFA" font-size="10.5" text-anchor="middle" font-family="sans-serif">ROUGE, BLEU, FMEval 연동</text>
    </g>
  </g>

  <!-- Bottom: Enterprise Security & Privacy Foundation -->
  <g transform="translate(40, 465)">
    <rect width="880" height="110" rx="12" fill="#0B1120" stroke="#334155"/>
    <text x="440" y="28" fill="#F8FAFC" font-size="13" font-weight="bold" text-anchor="middle" font-family="sans-serif">
      🔒 엔터프라이즈 보안 및 개인정보 보호 (Security &amp; Privacy by Design)
    </text>

    <!-- 3 Badges -->
    <g transform="translate(30, 42)">
      <!-- Badge 1 -->
      <rect x="0" y="0" width="250" height="52" rx="8" fill="#1E293B" stroke="#10B981"/>
      <text x="125" y="22" fill="#34D399" font-size="11.5" font-weight="bold" text-anchor="middle" font-family="sans-serif">데이터 불변 및 미학습 보장</text>
      <text x="125" y="40" fill="#94A3B8" font-size="10" text-anchor="middle" font-family="sans-serif">고객 데이터는 기본 FM 학습에 절대 미사용</text>

      <!-- Badge 2 -->
      <rect x="285" y="0" width="250" height="52" rx="8" fill="#1E293B" stroke="#3B82F6"/>
      <text x="410" y="22" fill="#60A5FA" font-size="11.5" font-weight="bold" text-anchor="middle" font-family="sans-serif">철저한 엔드투엔드 암호화</text>
      <text x="410" y="40" fill="#94A3B8" font-size="10" text-anchor="middle" font-family="sans-serif">전송 중 TLS 1.3 &amp; AWS KMS 미사용 암호화</text>

      <!-- Badge 3 -->
      <rect x="570" y="0" width="250" height="52" rx="8" fill="#1E293B" stroke="#F59E0B"/>
      <text x="695" y="22" fill="#FBBF24" font-size="11.5" font-weight="bold" text-anchor="middle" font-family="sans-serif">VPC PrivateLink &amp; IAM 통합</text>
      <text x="695" y="40" fill="#94A3B8" font-size="10" text-anchor="middle" font-family="sans-serif">인터넷 노출 없는 안전한 프라이빗 통신</text>
    </g>
  </g>
</svg>
