<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%" role="img" aria-labelledby="d2-bedrock-ecosystem-title d2-bedrock-ecosystem-desc">
  <title id="d2-bedrock-ecosystem-title">Amazon Bedrock 기반 생성형 AI 애플리케이션의 개념 구성</title>
  <desc id="d2-bedrock-ecosystem-desc">사용자 요청이 애플리케이션, 권한과 보호 통제, 선택한 파운데이션 모델, 그리고 선택적으로 연결한 지식 또는 도구를 거쳐 응답으로 돌아오는 높은 수준의 구성도입니다. 실제 기능과 모델 지원은 리전과 시점에 따라 다를 수 있습니다.</desc>
  <defs>
    <linearGradient id="background" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#0F172A"/><stop offset="100%" stop-color="#1E293B"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#94A3B8"/></marker>
  </defs>
  <rect width="960" height="520" rx="16" fill="url(#background)"/>
  <text x="480" y="42" text-anchor="middle" fill="#F8FAFC" font-size="24" font-weight="700" font-family="Segoe UI, sans-serif">Amazon Bedrock 기반 생성형 AI 애플리케이션: 개념 구성</text>
  <text x="480" y="66" text-anchor="middle" fill="#CBD5E1" font-size="13" font-family="Segoe UI, sans-serif">모델·기능 지원은 리전, 모델, 계정 설정에 따라 달라질 수 있습니다.</text>

  <g font-family="Segoe UI, sans-serif">
    <rect x="55" y="125" width="160" height="105" rx="12" fill="#1E3A5F" stroke="#60A5FA" stroke-width="2"/>
    <text x="135" y="158" text-anchor="middle" fill="#DBEAFE" font-size="17" font-weight="700">사용자</text>
    <text x="135" y="184" text-anchor="middle" fill="#BFDBFE" font-size="12">질문 · 지시 · 피드백</text>

    <rect x="290" y="105" width="210" height="145" rx="12" fill="#312E81" stroke="#A78BFA" stroke-width="2"/>
    <text x="395" y="140" text-anchor="middle" fill="#EDE9FE" font-size="17" font-weight="700">애플리케이션</text>
    <text x="395" y="168" text-anchor="middle" fill="#DDD6FE" font-size="12">프롬프트 구성 · 응답 처리</text>
    <text x="395" y="190" text-anchor="middle" fill="#DDD6FE" font-size="12">권한 확인 · 로그 설계</text>
    <text x="395" y="222" text-anchor="middle" fill="#C4B5FD" font-size="11">고객이 목적과 통제를 설계</text>

    <rect x="575" y="105" width="210" height="145" rx="12" fill="#78350F" stroke="#FBBF24" stroke-width="2"/>
    <text x="680" y="140" text-anchor="middle" fill="#FEF3C7" font-size="17" font-weight="700">Amazon Bedrock</text>
    <text x="680" y="168" text-anchor="middle" fill="#FDE68A" font-size="12">선택한 FM으로 추론 요청</text>
    <text x="680" y="190" text-anchor="middle" fill="#FDE68A" font-size="12">모델 접근과 사용 설정</text>
    <text x="680" y="222" text-anchor="middle" fill="#FCD34D" font-size="11">요구 사항에 맞는 모델 비교</text>

    <line x1="215" y1="177" x2="285" y2="177" stroke="#94A3B8" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="500" y1="177" x2="570" y2="177" stroke="#94A3B8" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="570" y1="205" x2="505" y2="205" stroke="#94A3B8" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="285" y1="205" x2="220" y2="205" stroke="#94A3B8" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="150" y="320" width="200" height="120" rx="12" fill="#064E3B" stroke="#34D399" stroke-width="2"/>
    <text x="250" y="354" text-anchor="middle" fill="#D1FAE5" font-size="16" font-weight="700">선택적 지식 연결</text>
    <text x="250" y="381" text-anchor="middle" fill="#A7F3D0" font-size="12">승인된 데이터 소스</text>
    <text x="250" y="403" text-anchor="middle" fill="#A7F3D0" font-size="12">검색 결과를 프롬프트에 제공</text>

    <rect x="405" y="320" width="200" height="120" rx="12" fill="#7F1D1D" stroke="#F87171" stroke-width="2"/>
    <text x="505" y="354" text-anchor="middle" fill="#FEE2E2" font-size="16" font-weight="700">보호 통제</text>
    <text x="505" y="381" text-anchor="middle" fill="#FECACA" font-size="12">최소 권한 · 입력/출력 정책</text>
    <text x="505" y="403" text-anchor="middle" fill="#FECACA" font-size="12">민감 정보 · 감사 요구 검토</text>

    <rect x="660" y="320" width="200" height="120" rx="12" fill="#334155" stroke="#CBD5E1" stroke-width="2"/>
    <text x="760" y="354" text-anchor="middle" fill="#F8FAFC" font-size="16" font-weight="700">평가와 모니터링</text>
    <text x="760" y="381" text-anchor="middle" fill="#CBD5E1" font-size="12">품질 · 안전 · 비용 · 지연 시간</text>
    <text x="760" y="403" text-anchor="middle" fill="#CBD5E1" font-size="12">피드백으로 설계 재검토</text>

    <line x1="395" y1="250" x2="275" y2="315" stroke="#34D399" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
    <line x1="500" y1="250" x2="505" y2="315" stroke="#F87171" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
    <line x1="680" y1="250" x2="745" y2="315" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  </g>
  <text x="480" y="485" text-anchor="middle" fill="#94A3B8" font-size="12" font-family="Segoe UI, sans-serif">그림은 학습용 개념도이며, 특정 모델·기능·보안 속성의 보장을 의미하지 않습니다.</text>
</svg>