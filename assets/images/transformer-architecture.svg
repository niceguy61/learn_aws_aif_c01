<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 640" width="100%" height="100%" role="img" aria-labelledby="transformer-architecture-title transformer-architecture-desc">
  <title id="transformer-architecture-title">트랜스포머 아키텍처 개념도</title>
  <desc id="transformer-architecture-desc">입력 임베딩, 인코더, 셀프 어텐션, 디코더와 출력이 연결되는 트랜스포머의 높은 수준 구조를 보여 주는 교육용 그림입니다.</desc>
  <defs>
    <linearGradient id="tfBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="encGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#1D4ED8" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="decGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EC4899" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#BE185D" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="mhaGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="ffGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="normGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
  </defs>

  <rect width="920" height="640" rx="16" fill="url(#tfBg)"/>

  <!-- Title -->
  <text x="460" y="38" fill="#F8FAFC" font-size="22" font-weight="bold" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">
    트랜스포머 (Transformer) 아키텍처 — "Attention Is All You Need"
  </text>
  <text x="460" y="60" fill="#94A3B8" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">
    대규모 병렬 처리와 Self-Attention 기반의 현대 파운데이션 모델(LLM) 표준 구조
  </text>

  <!-- ENCODER (Left) -->
  <g transform="translate(80, 80)">
    <rect width="340" height="460" rx="14" fill="url(#encGrad)" stroke="#3B82F6" stroke-width="2"/>
    <text x="170" y="30" fill="#60A5FA" font-size="16" font-weight="bold" text-anchor="middle" font-family="sans-serif">인코더 (Encoder) N회 반복</text>

    <!-- Positional + Input Embedding -->
    <rect x="50" y="390" width="240" height="40" rx="8" fill="#1E293B" stroke="#64748B"/>
    <text x="170" y="415" fill="#E2E8F0" font-size="13" text-anchor="middle" font-family="sans-serif">입력 임베딩 + 위치 인코딩</text>

    <line x1="170" y1="390" x2="170" y2="350" stroke="#94A3B8" stroke-width="2"/>

    <!-- Multi-Head Attention -->
    <rect x="50" y="295" width="240" height="50" rx="8" fill="url(#mhaGrad)"/>
    <text x="170" y="325" fill="#FFFFFF" font-size="13" font-weight="bold" text-anchor="middle" font-family="sans-serif">멀티 헤드 어텐션 (Multi-Head)</text>

    <line x1="170" y1="295" x2="170" y2="265" stroke="#94A3B8" stroke-width="2"/>

    <!-- Add & Norm 1 -->
    <rect x="70" y="225" width="200" height="38" rx="8" fill="url(#normGrad)"/>
    <text x="170" y="249" fill="#FFFFFF" font-size="12" font-weight="bold" text-anchor="middle" font-family="sans-serif">Add &amp; Norm (잔차 연결)</text>

    <line x1="170" y1="225" x2="170" y2="195" stroke="#94A3B8" stroke-width="2"/>

    <!-- Feed Forward -->
    <rect x="50" y="145" width="240" height="50" rx="8" fill="url(#ffGrad)"/>
    <text x="170" y="175" fill="#FFFFFF" font-size="13" font-weight="bold" text-anchor="middle" font-family="sans-serif">피드 포워드 신경망 (FFN)</text>

    <line x1="170" y1="145" x2="170" y2="115" stroke="#94A3B8" stroke-width="2"/>

    <!-- Add & Norm 2 -->
    <rect x="70" y="75" width="200" height="38" rx="8" fill="url(#normGrad)"/>
    <text x="170" y="99" fill="#FFFFFF" font-size="12" font-weight="bold" text-anchor="middle" font-family="sans-serif">Add &amp; Norm (정규화)</text>
  </g>

  <!-- Connection: Encoder output to Decoder Cross-Attention -->
  <path d="M 420 175 Q 460 175 460 250 T 500 295" stroke="#F59E0B" stroke-width="3" stroke-dasharray="6,4" fill="none"/>
  <text x="460" y="235" fill="#FBBF24" font-size="11" font-weight="bold" text-anchor="middle" font-family="sans-serif">인코더 키/값(K, V)<br/>컨텍스트 전달</text>

  <!-- DECODER (Right) -->
  <g transform="translate(500, 80)">
    <rect width="340" height="460" rx="14" fill="url(#decGrad)" stroke="#EC4899" stroke-width="2"/>
    <text x="170" y="30" fill="#F472B6" font-size="16" font-weight="bold" text-anchor="middle" font-family="sans-serif">디코더 (Decoder) N회 반복</text>

    <!-- Output Embedding -->
    <rect x="50" y="390" width="240" height="40" rx="8" fill="#1E293B" stroke="#64748B"/>
    <text x="170" y="415" fill="#E2E8F0" font-size="13" text-anchor="middle" font-family="sans-serif">출력 임베딩 + 위치 인코딩</text>

    <line x1="170" y1="390" x2="170" y2="360" stroke="#94A3B8" stroke-width="2"/>

    <!-- Masked Multi-Head Attention -->
    <rect x="50" y="315" width="240" height="45" rx="8" fill="url(#mhaGrad)"/>
    <text x="170" y="343" fill="#FFFFFF" font-size="12" font-weight="bold" text-anchor="middle" font-family="sans-serif">마스크드 멀티 헤드 어텐션</text>

    <line x1="170" y1="315" x2="170" y2="290" stroke="#94A3B8" stroke-width="2"/>

    <!-- Cross Attention -->
    <rect x="50" y="240" width="240" height="48" rx="8" fill="url(#mhaGrad)"/>
    <text x="170" y="270" fill="#FFFFFF" font-size="12" font-weight="bold" text-anchor="middle" font-family="sans-serif">크로스 어텐션 (인코더-디코더)</text>

    <line x1="170" y1="240" x2="170" y2="215" stroke="#94A3B8" stroke-width="2"/>

    <!-- Feed Forward -->
    <rect x="50" y="165" width="240" height="48" rx="8" fill="url(#ffGrad)"/>
    <text x="170" y="194" fill="#FFFFFF" font-size="12" font-weight="bold" text-anchor="middle" font-family="sans-serif">피드 포워드 신경망 (FFN)</text>

    <line x1="170" y1="165" x2="170" y2="135" stroke="#94A3B8" stroke-width="2"/>

    <!-- Add & Norm Final -->
    <rect x="70" y="95" width="200" height="38" rx="8" fill="url(#normGrad)"/>
    <text x="170" y="119" fill="#FFFFFF" font-size="12" font-weight="bold" text-anchor="middle" font-family="sans-serif">Add &amp; Norm (최종 출력 계층)</text>

    <line x1="170" y1="95" x2="170" y2="65" stroke="#94A3B8" stroke-width="2"/>

    <!-- Linear & Softmax -->
    <rect x="50" y="35" width="240" height="30" rx="6" fill="#0F172A" stroke="#10B981"/>
    <text x="170" y="55" fill="#34D399" font-size="12" font-weight="bold" text-anchor="middle" font-family="sans-serif">선형 변환 (Linear) + Softmax</text>
  </g>

  <!-- Output Bottom Label -->
  <text x="460" y="580" fill="#E2E8F0" font-size="14" font-weight="bold" font-family="sans-serif" text-anchor="middle">
    ➔ 다음 토큰 확률 분포(Next-Token Prediction) 산출 ➔ 새로운 텍스트 생성
  </text>
  <rect x="220" y="600" width="480" height="26" rx="6" fill="#1E293B"/>
  <text x="460" y="618" fill="#94A3B8" font-size="12" text-anchor="middle" font-family="sans-serif">
    💡 현대 LLM(GPT, Claude, Llama): 디코더 전용(Decoder-only) 트랜스포머 구조 주로 채택
  </text>
</svg>
